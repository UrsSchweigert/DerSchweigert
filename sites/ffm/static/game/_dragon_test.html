<!doctype html>
<html>
<head><meta charset="utf-8"><style>body{margin:0;background:#222}canvas{border:1px solid red;display:block}</style></head>
<body>
<canvas id="c" width="800" height="450"></canvas>
<script type="module">
  import { DragonSummon } from './entities.js?v=2';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const d = new DragonSummon(800, 312);
  const t = parseFloat(new URLSearchParams(location.search).get('t') || '0.9');
  d._life = d._maxLife - t;
  ctx.fillStyle = '#335577';
  ctx.fillRect(0,0,800,450);
  // draw a ground line for reference
  ctx.strokeStyle = '#00ff00';
  ctx.beginPath(); ctx.moveTo(0,312); ctx.lineTo(800,312); ctx.stroke();
  setTimeout(() => d.draw(ctx), 200); // wait for image load
</script>
</body>
</html>
