<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Arithmo Slayer</title>
  <link rel="icon" href="favicon.png" type="image/png" sizes="32x32">
  <link rel="icon" href="favicon.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#0d1b2a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Arithmo Slayer">
  <link rel="stylesheet" href="styles.css">
  <!-- Cloudflare Turnstile CAPTCHA widget script. Loaded here (not
       render=explicit) but our containers below don't carry the
       "cf-turnstile" class, so Turnstile's automatic implicit-render scan
       ignores them; main.js calls turnstile.render(...) on each container
       itself once this script has loaded, giving it full control over
       reading/resetting tokens for fetch()-based (non-native) submits. -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
  <div id="game-wrap">
  <canvas id="game" width="800" height="450"></canvas>
  
  <div id="input-zone">
    <div id="mc-buttons">
      <button class="mc-btn" type="button" touch-action="manipulation" data-index="0"></button>
      <button class="mc-btn" type="button" touch-action="manipulation" data-index="1"></button>
      <button class="mc-btn" type="button" touch-action="manipulation" data-index="2"></button>
      <button class="mc-btn" type="button" touch-action="manipulation" data-index="3"></button>
    </div>
    <div id="free-text-zone">
      <input id="answer-input" type="text" inputmode="numeric" placeholder="..." autocomplete="off" autocorrect="off" autocapitalize="off">
      <button id="strike-btn" type="button" touch-action="manipulation">Strike!</button>
    </div>
    <div id="timer-bar-container"></div>
  </div><!-- #input-zone -->
  </div><!-- #game-wrap -->

  <div id="top-bar">
    <button id="login-btn">Login</button>
    <span id="username-display" style="display:none"></span>
    <button id="logout-btn" style="display:none">Logout</button>
    <button id="mute-btn">🔊</button>
  </div>
  
  <div id="difficulty-select" class="overlay splash-screen">
    <div class="splash-bg" aria-hidden="true"></div>
    <div class="splash-content">
      <h1 class="splash-title">Arithmo Slayer</h1>
      <p class="splash-intro">Train your math reflexes, beat the clock, and climb the rankings one correct answer at a time.</p>
      <div class="splash-login-row">
        <button id="splash-login-btn" class="splash-btn splash-btn--secondary">Login / Register</button>
        <span id="splash-user-greeting" class="splash-greeting"></span>
      </div>
      <p class="splash-subtitle">Choose your difficulty:</p>
      <section class="splash-leaderboard" aria-live="polite">
        <div class="leaderboard-header">
          <h2 class="leaderboard-title">Leaderboard</h2>
          <select id="leaderboard-year-filter" class="leaderboard-filter">
            <option value="">All years</option>
          </select>
        </div>
        <p class="leaderboard-note">Showing high scores set in the last 2 weeks.</p>
        <p id="leaderboard-personal-best" class="leaderboard-personal-best" style="display:none"></p>
        <div id="score-history-chart" class="score-history-chart" style="display:none"></div>
        <p id="leaderboard-profile-prompt" class="leaderboard-profile-prompt" style="display:none"></p>
        <button id="leaderboard-complete-profile" class="splash-btn splash-btn--secondary" style="display:none">Complete profile</button>
        <ol id="leaderboard-list" class="leaderboard-list"></ol>
      </section>
      <div class="splash-diff-buttons">
        <button class="diff-btn splash-diff-btn" data-difficulty="easy" data-timer="15" data-hearts="7">
          <span class="diff-label">Easy</span>
          <span class="diff-detail">15 seconds · 7 hearts</span>
        </button>
        <button class="diff-btn splash-diff-btn" data-difficulty="medium" data-timer="10" data-hearts="5">
          <span class="diff-label">Medium</span>
          <span class="diff-detail">10 seconds · 5 hearts</span>
        </button>
        <button class="diff-btn splash-diff-btn" data-difficulty="hard" data-timer="5" data-hearts="3">
          <span class="diff-label">Hard</span>
          <span class="diff-detail">5 seconds · 3 hearts</span>
        </button>
      </div>
    </div>
  </div>
  
  <div id="auth-modal" class="overlay" style="display:none">
    <div class="overlay-card">
      <button id="close-auth">×</button>
      <div id="auth-tabs">
        <button id="tab-login" class="tab-btn active">Login</button>
        <button id="tab-register" class="tab-btn">Register</button>
      </div>
      <form id="login-form">
        <input id="login-username" type="text" placeholder="Username">
        <input id="login-password" type="password" placeholder="Password">
        <button type="submit">Login</button>
        <button type="button" id="forgot-password-link" class="link-btn">Forgot password?</button>
        <p id="login-error" class="error-msg"></p>
        <div id="login-verify-resend" style="display:none">
          <input id="login-resend-email" type="email" placeholder="Your email">
          <div id="turnstile-resend" class="turnstile-container"></div>
          <button type="button" id="login-resend-btn">Resend verification email</button>
        </div>
      </form>
      <form id="register-form" style="display:none">
        <input id="reg-username" type="text" placeholder="Username (3-20 chars)">
        <input id="reg-email" type="email" placeholder="Email">
        <input id="reg-password" type="password" placeholder="Password (8+ chars)">
        <input id="reg-first-grade-year" type="number" placeholder="First grade year (optional)">
        <div id="turnstile-register" class="turnstile-container"></div>
        <button type="submit">Register</button>
        <p id="register-error" class="error-msg"></p>
      </form>
      <form id="forgot-password-form" style="display:none">
        <input id="forgot-password-email" type="email" placeholder="Your email">
        <div id="turnstile-forgot-password" class="turnstile-container"></div>
        <button type="submit">Send reset link</button>
        <button type="button" id="back-to-login-link" class="link-btn">Back to login</button>
        <p id="forgot-password-message" class="error-msg"></p>
      </form>
      <form id="reset-password-form" style="display:none">
        <input id="reset-new-password" type="password" placeholder="New password (8+ chars)">
        <input id="reset-confirm-password" type="password" placeholder="Confirm new password">
        <button type="submit">Reset Password</button>
        <p id="reset-password-message" class="error-msg"></p>
      </form>
    </div>
  </div>
  
  <div id="account-modal" class="overlay" style="display:none">
    <div class="overlay-card">
      <button id="close-account" class="close-btn">×</button>
      <div id="account-tabs">
        <button id="tab-account-profile" class="tab-btn active">Profile</button>
        <button id="tab-account-password" class="tab-btn">Password</button>
        <button id="tab-account-scores" class="tab-btn">High Scores</button>
      </div>

      <div id="account-profile-panel">
        <form id="account-profile-form">
          <p>Current email: <strong id="account-current-email-display"></strong></p>
          <p id="account-pending-email-note" class="pending-email-note" style="display:none"></p>
          <input id="account-new-email" type="email" placeholder="New email (optional)">
          <input id="account-first-grade-year" type="number" placeholder="First grade year (optional)">
          <input id="account-profile-current-password" type="password" placeholder="Current password (required to change email)">
          <button type="submit">Save</button>
          <p id="account-profile-message" class="error-msg"></p>
        </form>
      </div>

      <div id="account-password-panel" style="display:none">
        <form id="account-password-form">
          <input id="account-current-password" type="password" placeholder="Current password">
          <input id="account-new-password" type="password" placeholder="New password (8+ chars)">
          <input id="account-confirm-new-password" type="password" placeholder="Confirm new password">
          <button type="submit">Change Password</button>
          <p id="account-password-message" class="error-msg"></p>
        </form>
      </div>

      <div id="account-scores-panel" style="display:none">
        <p id="account-personal-best" class="leaderboard-personal-best" style="display:none"></p>
        <div id="account-score-history-chart" class="score-history-chart" style="display:none"></div>
      </div>
    </div>
  </div>

  <div id="auth-status-modal" class="overlay" style="display:none">
    <div class="overlay-card">
      <button id="close-auth-status" class="close-btn">×</button>
      <p id="auth-status-message">Working...</p>
    </div>
  </div>
  
  <div id="level-clear" class="overlay" style="display:none">
    <div class="overlay-card">
      <h2 id="level-clear-title">Level Clear!</h2>
      <p id="level-clear-score"></p>
      <button class="diff-btn" id="btn-next-level">Next Level</button>
      <button class="diff-btn" id="btn-replay-level">Play Same Level Again</button>
      <button class="diff-btn" id="btn-save-score-return-title" style="display:none">Save Score &amp; Return to Title</button>
    </div>
  </div>

  <div id="game-over" class="overlay" style="display:none">
    <div class="overlay-card">
      <h2>Game Over</h2>
      <p id="game-over-score"></p>
      <button class="diff-btn" id="btn-retry-level">Try This Level Again</button>
      <button class="diff-btn" id="btn-return-title">Return to Title</button>
    </div>
  </div>

  <script type="module" src="game/main.js"></script>
</body>
</html>
