<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue-deep:    #0D47A1;
      --blue-royal:   #1565C0;
      --blue-bright:  #29B6F6;
      --glass-bg:     rgba(255,255,255,0.13);
      --glass-border: rgba(255,255,255,0.24);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      font-family: var(--font);
      min-height: 100dvh;
      background: transparent;
      color: #fff;
      padding: 1.5rem;
      padding-bottom: 3rem;
    }
    /* Fixed gradient in ::before so backdrop-filter composites correctly on iOS/Safari */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(ellipse at 15% 15%, var(--blue-bright) 0%, transparent 50%),
        radial-gradient(ellipse at 85% 85%, #0A257A   0%, transparent 50%),
        radial-gradient(ellipse at 85% 15%, var(--blue-bright) 0%, transparent 45%),
        radial-gradient(ellipse at 15% 85%, var(--blue-deep)   0%, transparent 45%)
        #d0e4f7;
    }

    /* ── Header ──────────────────────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      margin-bottom: 1.75rem;
      flex-wrap: wrap;
    }
    .logo {
      width: 2.8rem;
      height: 2.8rem;
      object-fit: contain;
      filter: brightness(0) invert(1);
      flex-shrink: 0;
    }
    header h1 {
      font-size: 1.25rem;
      font-weight: 600;
      flex: 1;
      min-width: 0;
    }
    header h1 span { opacity: 0.65; font-weight: 400; }

    .headerActions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    .back {
      color: rgba(255,255,255,0.85);
      text-decoration: none;
      font-size: 0.83rem;
      padding: 0.42rem 0.85rem;
      border-radius: 10px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: background 0.15s;
      white-space: nowrap;
    }
    .back:hover { background: rgba(255,255,255,0.22); }

    /* ── Language switcher ───────────────────────────────────────────────── */
    .langSwitcher {
      display: flex;
      gap: 0.2rem;
    }
    .langSwitcher button {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 7px;
      color: rgba(255,255,255,0.7);
      font-size: 0.65rem;
      font-weight: 700;
      padding: 0.2rem 0.42rem;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: background 0.15s, color 0.15s;
    }
    .langSwitcher button.active,
    .langSwitcher button:hover {
      background: rgba(255,255,255,0.28);
      color: #fff;
    }

    /* ── Sections ────────────────────────────────────────────────────────── */
    .sections {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-width: 680px;
      margin: 0 auto;
    }

    .section {
      display: flex;
      gap: 1rem;
      align-items: flex-start;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 18px;
      padding: 1.2rem 1.3rem;
    }

    .section__icon {
      font-size: 1.65rem;
      line-height: 1;
      flex-shrink: 0;
      margin-top: 0.1rem;
      user-select: none;
    }

    .section__content { flex: 1; min-width: 0; }

    .section__title {
      font-size: 0.97rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
      letter-spacing: -0.01em;
    }

    .section__body {
      font-size: 0.84rem;
      line-height: 1.65;
      color: rgba(255,255,255,0.82);
    }

    .section__body ul {
      padding-left: 1.1rem;
      margin-top: 0.3rem;
    }
    .section__body li { margin-bottom: 0.2rem; }

    .section__body a {
      color: #90CAF9;
      text-decoration: none;
    }
    .section__body a:hover { text-decoration: underline; }

    .section__body .tip {
      display: flex;
      align-items: baseline;
      gap: 0.4rem;
      margin-top: 0.5rem;
      font-size: 0.79rem;
      color: rgba(255,255,255,0.58);
      font-style: italic;
    }

    /* ── Footer ──────────────────────────────────────────────────────────── */
    footer {
      margin-top: 2rem;
      text-align: center;
      font-size: 0.72rem;
      opacity: 0.42;
    }
    footer a { color: inherit; }

    @media (max-width: 520px) {
      body { padding: 0.75rem; padding-bottom: 2.5rem; }
      .section { padding: 1rem 1rem; border-radius: 14px; }
      .section__icon { font-size: 1.4rem; }
    }
  </style>
</head>

                '<div class="tip">💡 No iOS, as notificações da app só chegam quando a app está aberta às 17:00 / 20:00. A importação de Calendário (📅) é a alternativa fiável: alertas nativos do iOS, sempre a horas.</div>'
        },
        {
          icon: '⚙️',
          title: 'Idioma e definições',
          body: 'A app está disponível em <strong>alemão, inglês e português</strong>. Mude o idioma com os botões <strong>[DE | EN | PT]</strong> no rodapé da app.' +
                '<br><br>Para utilizadores nos <strong>EUA</strong>, as temperaturas são apresentadas em °F e as distâncias em milhas – detectadas automaticamente pelo país.' +
                '<div class="tip">💡 Redefina a sua localização a qualquer momento através de 📍 no rodapé para escolher um novo local.</div>'
        },
        {
          icon: '🔒',
          title: 'Privacidade',
          body: 'A sua localização <strong>não é guardada</strong>. É enviada com cada pedido a serviços externos (Google Maps, HERE Technologies, Open-Meteo, etc.) para obter os dados relevantes. Não existe conta de utilizador nem rastreio entre sessões.' +
                '<br><br>Detalhes completos na <a href="/datenschutz.html">Política de Privacidade</a>.'
        }
      ]
    }
  };

  function detectLang() {
    var stored = localStorage.getItem('lhc_lang');
    if (stored && dict[stored]) return stored;
    var browser = (navigator.language || 'de').split('-')[0];
    return dict[browser] ? browser : 'de';
  }

  var currentLang = detectLang();

  function render(lang) {
    var t = dict[lang] || dict.de;
    document.documentElement.lang = lang;
    document.title = 'Hilfe – Landhauscheck';

    document.getElementById('hdr-sub').textContent   = t.hdrSub;
    document.getElementById('back-link').textContent = t.back;
    document.getElementById('ft-impressum').textContent  = t.impressum;
    document.getElementById('ft-datenschutz').textContent = t.datenschutz;

    document.querySelectorAll('.langSwitcher button').forEach(function(btn) {
      btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
    });

    var container = document.getElementById('sections');
    container.innerHTML = t.sections.map(function(s) {
      return '<div class="section">' +
               '<div class="section__icon">' + s.icon + '</div>' +
               '<div class="section__content">' +
                 '<div class="section__title">' + s.title + '</div>' +
                 '<div class="section__body">' + s.body + '</div>' +
               '</div>' +
             '</div>';
    }).join('');
  }

  function switchLang(lang) {
    localStorage.setItem('lhc_lang', lang);
    currentLang = lang;
    render(lang);
  }

  render(currentLang);
  </script>
</body>
</html>
