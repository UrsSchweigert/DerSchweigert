name: 'Arithmo Slayer: Android release'

# Explicit, manual-only Android release build for sites/ffm/mobile. This is
# intentionally SEPARATE from deploy.yml (the website) and from
# arithmoslayer-build-artifacts.yml (unsigned debug APK / iOS project) and NEVER
# runs on a website deploy or push. It produces a signed .aab artifact for
# manual upload to Google Play. It does NOT upload to Google Play (publication
# stays manual, owner-approved).
on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'versionName (e.g. 1.1)'
        required: true
      versionCode:
        description: 'versionCode (integer, must strictly increase)'
        required: true
  push:
    tags:
      - 'arithmoslayer-v*'

permissions:
  contents: read

defaults:
  run:
    working-directory: sites/ffm/mobile

jobs:
  build-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sites/ffm/mobile/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Restore dependencies
        run: npm run restore

      - name: Run shared tests
        run: npm test

      - name: Resolve version (tag or inputs)
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            NAME="${GITHUB_REF_NAME#arithmoslayer-v}"
            CODE="${{ github.run_number }}"
          else
            NAME="${{ github.event.inputs.versionName }}"
            CODE="${{ github.event.inputs.versionCode }}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building versionName=$NAME versionCode=$CODE"

      - name: Decode upload keystore
        env:
          FFM_KEYSTORE_BASE64: ${{ secrets.FFM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$FFM_KEYSTORE_BASE64" ]; then
            echo "::error::Missing secret FFM_KEYSTORE_BASE64. Add the base64-encoded upload keystore and the FFM_KEYSTORE_PASSWORD / FFM_KEY_ALIAS / FFM_KEY_PASSWORD secrets. See sites/ffm/mobile/RELEASING.md."
            exit 1
          fi
          echo "$FFM_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Build signed AAB
        env:
          FFM_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          FFM_KEYSTORE_PASSWORD: ${{ secrets.FFM_KEYSTORE_PASSWORD }}
          FFM_KEY_ALIAS: ${{ secrets.FFM_KEY_ALIAS }}
          FFM_KEY_PASSWORD: ${{ secrets.FFM_KEY_PASSWORD }}
          FFM_VERSION_NAME: ${{ steps.ver.outputs.name }}
          FFM_VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: npm run build:release

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: arithmoslayer-${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}-aab
          path: sites/ffm/mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
