name: Deploy to production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q
        env:
          PYTHONPATH: ${{ github.workspace }}

  test-ffm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r sites/ffm/requirements-dev.txt -q
      - run: SECRET_KEY=ci-test-key pytest sites/ffm/tests/ -q --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}

  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      has_secrets: ${{ steps.check.outputs.has_secrets }}
    steps:
      - id: check
        run: |
          if [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ] && [ -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: [test, check-secrets]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && needs.check-secrets.outputs.has_secrets == 'true'
    env:
      AWS_REGION: ${{ secrets.AWS_REGION || 'eu-central-1' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      TF_VAR_route53_zone_id: ${{ secrets.ROUTE53_ZONE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Set deployment target
        run: echo "Deploy target - derschweigert.de"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Ensure Terraform backend exists
        run: |
          STATE_BUCKET="derschweigert-terraform-state"
          LOCK_TABLE="derschweigert-terraform-locks"

          if ! aws s3api head-bucket --bucket "$STATE_BUCKET" >/dev/null 2>&1; then
            if [ "$AWS_REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$STATE_BUCKET" --region "$AWS_REGION"
            else
              aws s3api create-bucket --bucket "$STATE_BUCKET" --region "$AWS_REGION" --create-bucket-configuration "LocationConstraint=$AWS_REGION"
            fi
            aws s3api put-bucket-versioning --bucket "$STATE_BUCKET" --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$STATE_BUCKET" --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          fi

          if ! aws dynamodb describe-table --table-name "$LOCK_TABLE" --region "$AWS_REGION" >/dev/null 2>&1; then
            aws dynamodb create-table \
              --table-name "$LOCK_TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region "$AWS_REGION"
          fi

      - name: Provision infrastructure with Terraform
        run: |
          terraform -chdir=infra/terraform/sites/derschweigert init -upgrade -reconfigure
          terraform -chdir=infra/terraform/sites/derschweigert apply -auto-approve

      - name: Upload static site files
        run: |
          BUCKET=$(terraform -chdir=infra/terraform/sites/derschweigert output -raw site_bucket)
          aws s3 sync sites/derschweigert/templates "s3://$BUCKET" --delete
          aws s3 sync sites/derschweigert/static "s3://$BUCKET/static" --delete

      - name: Verify Route53 aliases point to the Terraform CloudFront distribution
        run: |
          DIST_ID=$(terraform -chdir=infra/terraform/sites/derschweigert output -raw cloudfront_distribution_id)
          CF_DOMAIN=$(aws cloudfront get-distribution --id "$DIST_ID" --query 'Distribution.DomainName' --output text)

          python3 - "$TF_VAR_route53_zone_id" "$CF_DOMAIN" <<'PY'
          import json
          import subprocess
          import sys

          zone_id, cf_domain = sys.argv[1], sys.argv[2]
          for host in ["derschweigert.de", "www.derschweigert.de"]:
              result = subprocess.check_output([
                  "aws", "route53", "list-resource-record-sets",
                  "--hosted-zone-id", zone_id,
                  "--output", "json"
              ], text=True)
              rrset = json.loads(result)
              target = None
              for record in rrset.get("ResourceRecordSets", []):
                  if record.get("Name") == f"{host}." and record.get("Type") == "A":
                      target = record.get("AliasTarget", {}).get("DNSName")
                      break
              if target is None:
                  raise SystemExit(f"Missing Route53 A alias for {host}")
              print(f"{host} -> {target}")
              if target.rstrip('.').lower() != cf_domain.rstrip('.').lower():
                  raise SystemExit(f"Route53 alias mismatch for {host}: expected {cf_domain}, got {target}")
          PY

      - name: Invalidate CloudFront cache
        run: |
          DIST_ID=$(terraform -chdir=infra/terraform/sites/derschweigert output -raw cloudfront_distribution_id)
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"

  deploy-ffm:
    needs: [test-ffm, check-secrets]
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/main' &&
      needs.check-secrets.outputs.has_secrets == 'true'
    env:
      AWS_REGION: eu-central-1
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: eu-central-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Ensure Terraform backend exists
        run: |
          STATE_BUCKET="derschweigert-terraform-state"
          LOCK_TABLE="derschweigert-terraform-locks"

          if ! aws s3api head-bucket --bucket "$STATE_BUCKET" >/dev/null 2>&1; then
            aws s3api create-bucket --bucket "$STATE_BUCKET" --region "$AWS_REGION" --create-bucket-configuration "LocationConstraint=$AWS_REGION"
            aws s3api put-bucket-versioning --bucket "$STATE_BUCKET" --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$STATE_BUCKET" --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          fi

          if ! aws dynamodb describe-table --table-name "$LOCK_TABLE" --region "$AWS_REGION" >/dev/null 2>&1; then
            aws dynamodb create-table \
              --table-name "$LOCK_TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region "$AWS_REGION"
          fi

      - name: Provision infrastructure with Terraform
        run: |
          terraform -chdir=infra/terraform/sites/ffm init -upgrade -reconfigure
          terraform -chdir=infra/terraform/sites/ffm apply -auto-approve

      - name: Build Lambda zip
        run: |
          set -x
          sudo apt-get install -y zip -q
          rm -rf sites/ffm/build
          mkdir -p sites/ffm/build
          # install manylinux wheels — compatible with Lambda's Amazon Linux 2023
          pip install \
            --platform manylinux2014_x86_64 \
            --implementation cp \
            --python-version 3.12 \
            --only-binary=:all: \
            -t sites/ffm/build/ \
            -r sites/ffm/requirements.txt
          cp -r sites/ffm/app sites/ffm/build/
          cp sites/ffm/lambda/handler.py sites/ffm/build/
          (cd sites/ffm/build && zip -r ../ffm-lambda.zip .)
          ls -lh sites/ffm/ffm-lambda.zip

      - name: Update Lambda function code
        run: |
          set -x
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="ffm-site-${ACCOUNT_ID}"
          aws s3 cp sites/ffm/ffm-lambda.zip "s3://$BUCKET/deployments/ffm-lambda.zip" --region eu-central-1
          aws lambda wait function-updated --function-name ffm-api --region eu-central-1
          aws lambda update-function-code \
            --function-name ffm-api \
            --s3-bucket "$BUCKET" \
            --s3-key deployments/ffm-lambda.zip \
            --region eu-central-1
          aws lambda wait function-updated --function-name ffm-api --region eu-central-1

      - name: Sync static assets to S3
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="ffm-site-${ACCOUNT_ID}"
          # Deliberately NOT a long max-age for any of these (previously
          # "public, max-age=31536000" == 1 year on everything but
          # index.html). Filenames here aren't content-hashed/fingerprinted,
          # so a 1-year browser cache meant any visitor who'd loaded the
          # site before a given deploy kept serving stale styles.css/main.js
          # indefinitely, mismatched against the freshly-deployed index.html
          # - exactly the class of bug that broke the desktop layout on
          # 2026-09-06 (a stale cached styles.css/main.js pairing with new
          # markup) until the user did a full cache-clearing hard reload.
          # "no-cache, must-revalidate" still lets browsers/CloudFront cache
          # these locally, but forces a conditional (ETag) revalidation on
          # every load, so a changed file is always picked up immediately
          # while an unchanged one just gets a cheap 304 instead of a full
          # re-download - the safety of no-cache with most of the
          # bandwidth savings of long-lived caching.
          aws s3 sync sites/ffm/static/ "s3://$BUCKET/" \
            --delete \
            --cache-control "no-cache, must-revalidate" \
            --exclude "index.html"
          aws s3 cp sites/ffm/static/index.html \
            "s3://$BUCKET/index.html" \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?contains(Aliases.Items,'ffm.derschweigert.de')].Id | [0]" \
            --output text)
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"

      - name: Smoke test
        run: |
          sleep 10
          curl -sf https://ffm.derschweigert.de/ > /dev/null
          curl -sf https://ffm.derschweigert.de/api/health | grep '"ok":true'
