name: 'Sites: deploy to production'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'harness/run/**']   # a harness run lands on its own protected branch first
  # The manual release. A merge to main deploys ffm to ffm-dev.derschweigert.de only (the deploy-ffm-dev job below);
  # production ffm is deployed from here: Actions -> "Sites: deploy to production" -> Run workflow, on `main`. The run
  # tests ffm again and then deploys whatever `main` holds at that moment, so several merges can go out as one release.
  # It is also how a changed FFM billing/access repository variable is applied without a code push.
  # The other three sites have no dev copy and still deploy on the merge; `all` redeploys them from here as well.
  workflow_dispatch:
    inputs:
      sites:
        description: 'What to deploy to production'
        type: choice
        options: [ffm, all]
        default: ffm

concurrency:
  # A pull request's superseded runs are cancelled — they only test a branch, and the newest run tests everything that
  # branch needs. A `main` run must never cancel its predecessor: the deploy jobs are path-filtered per site, so a
  # cancelled run takes its commit's changes down with it, and a later merge that touches only another site (or only
  # `.github/workflows/`) never deploys them. That is exactly how the #426 speedrun release missed production on
  # 2026-11-13: its `deploy-ffm` was cancelled by the #427 push, and #427 changed only a workflow file, which
  # deliberately deploys nothing. `main` runs queue instead, so every merge's own diff still gets deployed.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # Read-only on pull request metadata, for the changed-file list behind the site gates below.
  pull-requests: read
  # Read-only on check runs, for the proof that a merged tree was already tested on its pull request.
  checks: read

jobs:
  # Which sites a change touches, and whether it touches their code or only their infrastructure. Required checks make a
  # skipped job awkward and a workflow that never starts leaves its checks "expected" forever, so the gates below are
  # explicit outputs that every other job reads. Anything uncertain reports every site as changed, because over-testing
  # is cheap and a silently untested deploy is not.
  changes:
    runs-on: ubuntu-latest
    outputs:
      ffm_tests: ${{ steps.diff.outputs.ffm_tests }}
      ffm: ${{ steps.diff.outputs.ffm }}
      ffm_dev: ${{ steps.diff.outputs.ffm_dev }}
      lesen: ${{ steps.diff.outputs.lesen }}
      site: ${{ steps.diff.outputs.site }}
      lhc_tests: ${{ steps.diff.outputs.lhc_tests }}
      lhc: ${{ steps.diff.outputs.lhc }}
      site_tests: ${{ steps.diff.outputs.site_tests }}
      harness_tests: ${{ steps.diff.outputs.harness_tests }}
      lesen_tests: ${{ steps.diff.outputs.lesen_tests }}
    steps:
      # A merge to main used to run every suite a second time, although `main` only accepts an up-to-date branch whose
      # checks passed, so the merged tree is the tree the pull request tested. That re-test doubled the wait between a
      # merge and its deploy and proved nothing new. This step does not take the branch rules on trust: it looks up the
      # pull request this commit merged, compares the two tree ids (the identity of the content, whatever the merge
      # method), and requires the three test checks to have succeeded on that pull request's head. Only then does the
      # next step drop the suites. Anything else (a direct push, a tree that differs, a check that did not succeed, a
      # failed API call) leaves `tested=false`, and every suite runs exactly as before.
      - id: proof
        name: Was this merged tree already tested on its pull request?
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          tested=false
          tree_of() { gh api "repos/$REPO/git/commits/$1" --jq '.tree.sha' 2>/dev/null; }
          merged_tree="$(tree_of "$HEAD_SHA")" || merged_tree=""
          heads="$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" 2>/dev/null \
                    | jq -r --arg sha "$HEAD_SHA" '.[] | select(.merged_at != null and .merge_commit_sha == $sha) | .head.sha' 2>/dev/null)" || heads=""
          for head in $heads; do
            head_tree="$(tree_of "$head")" || head_tree=""
            if [ -z "$merged_tree" ] || [ "$head_tree" != "$merged_tree" ]; then
              echo "::notice::pull request head $head has another tree than the merge; its checks do not cover this commit"
              continue
            fi
            proven=true
            for name in test test-ffm test-lhc; do
              # `filter=latest` returns the newest run of each name, so a re-run that failed is not hidden by an older pass.
              # Every run that is reported must be a success, and there must be at least one.
              conclusions="$(gh api "repos/$REPO/commits/$head/check-runs?check_name=$name&filter=latest&per_page=100" 2>/dev/null \
                              | jq -r '[.check_runs[] | select(.app.slug == "github-actions") | (.conclusion // "pending")] | unique | join(" ")' 2>/dev/null)" || conclusions=""
              if [ "$conclusions" != success ]; then
                echo "::notice::check $name on $head reports '${conclusions:-nothing}', not success"
                proven=false
              fi
            done
            if [ "$proven" = true ]; then
              tested=true
              echo "::notice::tree $merged_tree was tested on pull request head $head; the suites are not run again"
              break
            fi
          done
          [ "$tested" = true ] || echo "::notice::no proof that this tree was tested; every suite the change needs runs here"
          echo "tested=$tested" >> "$GITHUB_OUTPUT"

      - id: diff
        name: List the changed paths
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TESTED: ${{ steps.proof.outputs.tested }}
          EVENT: ${{ github.event_name }}
          RELEASE: ${{ inputs.sites }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ffm_tests=false; ffm=false; lesen=false; site=false; lhc_tests=false; lhc=false
          site_tests=false; harness_tests=false; lesen_tests=false; ffm_dev=false
          changed=""; listed=true
          if [ "${EVENT:-}" = workflow_dispatch ] && [ "${RELEASE:-}" = ffm ]; then
            # The manual ffm release: there is no diff to read, the owner asked for ffm. Its suite runs first.
            echo "::notice::manual release of ffm to production"
            ffm_tests=true; ffm=true
          elif [ -n "${PR:-}" ]; then
            # The files endpoint pages through every file, so nothing is truncated. `--slurp` cannot be combined with
            # `--jq` (gh rejects the pair), so paginate and filter per page instead.
            changed="$(gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" \
                        --jq '.[] | .filename' 2>/dev/null)" || listed=false
          elif [ -n "${BASE:-}" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            compared="$(gh api "repos/$REPO/compare/$BASE...$HEAD_SHA" 2>/dev/null)" || listed=false
            changed="$(printf '%s' "$compared" | jq -r '.files[]?.filename' 2>/dev/null)" || listed=false
            # GitHub caps a compare at 300 files; a truncated list says nothing about the rest.
            if printf '%s' "$compared" | jq -e '(.files | length) >= 300' >/dev/null 2>&1; then listed=false; fi
          else
            listed=false
          fi
          if [ "${EVENT:-}" = workflow_dispatch ] && [ "${RELEASE:-}" = ffm ]; then
            :
          elif [ "$listed" != true ] || [ -z "$changed" ]; then
            echo "::warning::could not list every changed path; treating every site as changed"
            ffm_tests=true; ffm=true; lesen=true; site=true; lhc_tests=true; lhc=true
            site_tests=true; harness_tests=true; lesen_tests=true
          else
            # Application code changes need that site's tests and deploy. A site's own terraform needs its deploy but not
            # its tests, because the application did not change. Shared modules and anything else under infra/ can reach
            # any site, so they deploy every site.
            while IFS= read -r path; do
              case "$path" in
                sites/ffm/*) ffm_tests=true; ffm=true ;;
                sites/lesen/*) lesen=true ;;
                sites/derschweigert/*) site=true ;;
                sites/landhauscheck/*) lhc_tests=true; lhc=true ;;
                infra/terraform/sites/ffm/*) ffm=true ;;
                infra/terraform/sites/lesen/*) lesen=true ;;
                infra/terraform/sites/derschweigert/*) site=true ;;
                infra/terraform/sites/landhauscheck/*) lhc=true ;;
                # The ffm dev stack belongs to the dev deploy alone. Without this line it would fall into the infra/*
                # catch-all below and a merge would deploy every site, production included.
                infra/terraform/sites/ffm-dev/*) ffm_dev=true ;;
                infra/*) ffm=true; lesen=true; site=true; lhc=true ;;
              esac
              # Each shared suite runs only when something it reads changed. The derschweigert suite reads its own site and
              # that site's main.tf; the harness suite reads tools/ and the lesen-native workflow; the lesen suite reads
              # sites/lesen and its Terraform deployment. The shared iOS preparation script affects both native apps.
              # The site and harness suites depend on the root requirements and pytest.ini (and the workflow below).
              case "$path" in
                tools/ios/*) ffm_tests=true; lesen_tests=true; harness_tests=true ;;
                sites/derschweigert/*|infra/terraform/sites/derschweigert/*) site_tests=true ;;
                tools/*|docs/harness/*) harness_tests=true ;;
                sites/lesen/*|infra/terraform/sites/lesen/*) lesen_tests=true ;;
                requirements.txt|pytest.ini) site_tests=true; harness_tests=true ;;
              esac
            done <<< "$changed"
            # A workflow change runs every test job so the pipeline itself is exercised, but it does not deploy a site
            # whose files did not change: a CI tweak must not apply terraform to every site.
            if grep -Eq '^\.github/workflows/' <<< "$changed"; then
              echo "::notice::the workflow changed; running every test job"
              ffm_tests=true
              lhc_tests=true
              site_tests=true
              harness_tests=true
              lesen_tests=true
            fi
          fi
          # Last, so it also covers the two "run everything" cases above. The deploy outputs are left alone: a tested
          # tree still has to be deployed. See the proof step for what `TESTED` means.
          if [ "${TESTED:-}" = true ]; then
            echo "::notice::this tree passed its tests on the pull request; no suite runs again before the deploy"
            ffm_tests=false; lhc_tests=false; site_tests=false; harness_tests=false; lesen_tests=false
          fi
          echo "changed -> ffm_tests=$ffm_tests deploy ffm=$ffm lesen=$lesen site=$site lhc_tests=$lhc_tests deploy lhc=$lhc site_tests=$site_tests harness_tests=$harness_tests lesen_tests=$lesen_tests"
          printf 'ffm_tests=%s\nffm=%s\nlesen=%s\nsite=%s\nlhc_tests=%s\nlhc=%s\nsite_tests=%s\nharness_tests=%s\nlesen_tests=%s\n' \
            "$ffm_tests" "$ffm" "$lesen" "$site" "$lhc_tests" "$lhc" "$site_tests" "$harness_tests" "$lesen_tests" >> "$GITHUB_OUTPUT"
          echo "ffm_dev=$ffm_dev" >> "$GITHUB_OUTPUT"

  # The shared suites run as separate jobs so they run in parallel and each skips on its own paths. `test` stays the
  # one required check: it fails unless every suite its change needed passed, so deploy and branch protection are
  # unchanged.
  test-site:
    needs: [changes]
    if: needs.changes.outputs.site_tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pip install ruff==0.17.5 && ruff check sites/derschweigert
      - run: pytest -q sites/derschweigert/tests
        env:
          PYTHONPATH: ${{ github.workspace }}

  test-harness:
    needs: [changes]
    if: needs.changes.outputs.harness_tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pip install ruff==0.17.5 && ruff check tools
      - run: pytest -q tools/harness/tests
        env:
          PYTHONPATH: ${{ github.workspace }}

  test-lesen:
    needs: [changes]
    if: needs.changes.outputs.lesen_tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          # No npm cache: the suite imports only node built-ins and files next to it, so nothing is installed here.
          # Caching a dependency tree this job never downloads would restore and save an empty cache on every run.
      - run: node --test sites/lesen/tests/*.test.mjs

  test:
    needs: [changes, test-site, test-harness, test-lesen]
    # always() so a failed `changes` or suite shows up here as a red check instead of leaving this required check skipped.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every suite the change needed
        env:
          CHANGES: ${{ needs.changes.result }}
          SITE_NEEDED: ${{ needs.changes.outputs.site_tests }}
          HARNESS_NEEDED: ${{ needs.changes.outputs.harness_tests }}
          LESEN_NEEDED: ${{ needs.changes.outputs.lesen_tests }}
          SITE: ${{ needs.test-site.result }}
          HARNESS: ${{ needs.test-harness.result }}
          LESEN: ${{ needs.test-lesen.result }}
        run: |
          set -euo pipefail
          if [ "$CHANGES" != success ]; then
            echo "::error::the changes job produced no result, so nothing proves the shared code and lesen were tested"
            exit 1
          fi
          failed=0
          check() {
            # name needed result: a needed suite must have succeeded; an unneeded one must have been skipped.
            if [ "$2" = true ] && [ "$3" != success ]; then echo "::error::$1 tests were needed but the job result is $3"; failed=1; fi
            if [ "$2" != true ] && [ "$3" != skipped ]; then echo "::error::$1 tests were not expected to run but the job result is $3"; failed=1; fi
          }
          check derschweigert "$SITE_NEEDED" "$SITE"
          check harness "$HARNESS_NEEDED" "$HARNESS"
          check lesen "$LESEN_NEEDED" "$LESEN"
          exit "$failed"

  test-ffm:
    needs: [changes]
    # always() so a failed `changes` job shows up here as a red check instead of leaving this required check skipped.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to report an untested ffm as passing
        if: needs.changes.outputs.ffm_tests == ''
        run: |
          echo "::error::the changes job produced no result, so nothing proves sites/ffm was tested"
          exit 1
      - name: sites/ffm needs no test run
        if: needs.changes.outputs.ffm_tests == 'false'
        run: echo "::notice::sites/ffm code is unchanged, or this tree already passed on its pull request; its tests are skipped"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.ffm_tests == 'true'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: needs.changes.outputs.ffm_tests == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sites/ffm/requirements-dev.txt
      - run: python -m pip install --upgrade pip
        if: needs.changes.outputs.ffm_tests == 'true'
      - run: pip install -r sites/ffm/requirements-dev.txt -q
        if: needs.changes.outputs.ffm_tests == 'true'
      # One worker per core. The flag lives here and not in a pytest config file, so a plain `pytest sites/ffm/tests`
      # (a developer, a harness check in its own container) never needs pytest-xdist installed.
      - run: SECRET_KEY=ci-test-key pytest sites/ffm/tests/ -q --tb=short -n auto
        if: needs.changes.outputs.ffm_tests == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}
      - run: pip install ruff==0.17.5 && ruff check sites/ffm
        if: needs.changes.outputs.ffm_tests == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.changes.outputs.ffm_tests == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sites/ffm/mobile/package-lock.json
      - run: node --test sites/ffm/static/game/*.test.js
        if: needs.changes.outputs.ffm_tests == 'true'
      - run: node --test sites/ffm/static/promo/*.test.js
        if: needs.changes.outputs.ffm_tests == 'true'
      - run: node --test sites/ffm/static/beta/*.test.js
        if: needs.changes.outputs.ffm_tests == 'true'
      - run: node --test sites/ffm/static/story/tests/*.test.mjs
        if: needs.changes.outputs.ffm_tests == 'true'
      - run: node --test sites/ffm/scripts/*.test.mjs
        if: needs.changes.outputs.ffm_tests == 'true'
      # The app shell has its own suite: copy-assets exclusions, bundle completeness and the platform scaffolds. Until
      # now only arithmoslayer-native.yml ran it, and that workflow is push-to-main only, so a pull request could add a
      # file under static/ without the matching copy-assets rule and leave main red after the merge. These are plain
      # Node tests with no Android or iOS toolchain, so they cost seconds here and fail the PR instead.
      - run: cd sites/ffm/mobile && npm ci && npm test
        if: needs.changes.outputs.ffm_tests == 'true'

  test-lhc:
    needs: [changes]
    # always() so a failed `changes` job shows up here as a red check instead of leaving this required check skipped.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to report an untested landhauscheck as passing
        if: needs.changes.outputs.lhc_tests == ''
        run: |
          echo "::error::the changes job produced no result, so nothing proves sites/landhauscheck was tested"
          exit 1
      - name: sites/landhauscheck needs no test run
        if: needs.changes.outputs.lhc_tests == 'false'
        run: echo "::notice::sites/landhauscheck code is unchanged, or this tree already passed on its pull request; its tests are skipped"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.lhc_tests == 'true'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: needs.changes.outputs.lhc_tests == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sites/landhauscheck/requirements-dev.txt
      - name: Install backend dev dependencies
        if: needs.changes.outputs.lhc_tests == 'true'
        run: python -m pip install -r sites/landhauscheck/requirements-dev.txt
      # Scope matches the pre-migration CI (backend package only); scripts/ was never linted.
      - name: Lint
        if: needs.changes.outputs.lhc_tests == 'true'
        run: |
          cd sites/landhauscheck
          ruff check app tests alembic
      # tests/smoke needs a running BASE_URL, so it is a deploy-time check, not a unit test.
      - name: Backend unit tests
        if: needs.changes.outputs.lhc_tests == 'true'
        run: PYTHONPATH=sites/landhauscheck pytest sites/landhauscheck/tests -q --ignore=sites/landhauscheck/tests/smoke
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.changes.outputs.lhc_tests == 'true'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sites/landhauscheck/frontend/package-lock.json
      - name: Frontend unit tests
        if: needs.changes.outputs.lhc_tests == 'true'
        run: |
          cd sites/landhauscheck/frontend
          npm ci
          npm test
      - name: Frontend build
        if: needs.changes.outputs.lhc_tests == 'true'
        run: |
          cd sites/landhauscheck/frontend
          npm run build

  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      has_secrets: ${{ steps.check.outputs.has_secrets }}
    steps:
      - id: check
        run: |
          if [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ] && [ -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: [test, check-secrets, changes]
    runs-on: ubuntu-latest
    # !cancelled() + explicit results: `test` itself skips suites, and a skipped ancestor would otherwise skip this deploy.
    if: |
      !cancelled() &&
      needs.test.result == 'success' &&
      needs.check-secrets.result == 'success' &&
      needs.changes.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      needs.check-secrets.outputs.has_secrets == 'true' &&
      needs.changes.outputs.site == 'true'
    env:
      AWS_REGION: ${{ secrets.AWS_REGION || 'eu-central-1' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      TF_VAR_route53_zone_id: ${{ secrets.ROUTE53_ZONE_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set deployment target
        run: echo "Deploy target - derschweigert.de"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.5.7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Ensure Terraform backend exists
        run: |
          STATE_BUCKET="derschweigert-terraform-state"
          LOCK_TABLE="derschweigert-terraform-locks"

          if ! aws s3api head-bucket --bucket "$STATE_BUCKET" >/dev/null 2>&1; then
            if [ "$AWS_REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$STATE_BUCKET" --region "$AWS_REGION"
            else
              aws s3api create-bucket --bucket "$STATE_BUCKET" --region "$AWS_REGION" --create-bucket-configuration "LocationConstraint=$AWS_REGION"
            fi
            aws s3api put-bucket-versioning --bucket "$STATE_BUCKET" --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$STATE_BUCKET" --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          fi

          if ! aws dynamodb describe-table --table-name "$LOCK_TABLE" --region "$AWS_REGION" >/dev/null 2>&1; then
            aws dynamodb create-table \
              --table-name "$LOCK_TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region "$AWS_REGION"
          fi

      - name: Provision infrastructure with Terraform
        run: |
          terraform -chdir=infra/terraform/sites/derschweigert init -upgrade -reconfigure
          terraform -chdir=infra/terraform/sites/derschweigert apply -auto-approve

      - name: Upload static site files
        run: |
          BUCKET=$(terraform -chdir=infra/terraform/sites/derschweigert output -raw site_bucket)
          aws s3 sync sites/derschweigert/templates "s3://$BUCKET" --delete
          aws s3 sync sites/derschweigert/static "s3://$BUCKET/static" --delete

      - name: Verify Route53 aliases point to the Terraform CloudFront distribution
        run: |
          DIST_ID=$(terraform -chdir=infra/terraform/sites/derschweigert output -raw cloudfront_distribution_id)
          CF_DOMAIN=$(aws cloudfront get-distribution --id "$DIST_ID" --query 'Distribution.DomainName' --output text)

          python3 - "$TF_VAR_route53_zone_id" "$CF_DOMAIN" <<'PY'
          import json
          import subprocess
          import sys

          zone_id, cf_domain = sys.argv[1], sys.argv[2]
          for host in ["derschweigert.de", "www.derschweigert.de"]:
              result = subprocess.check_output([
                  "aws", "route53", "list-resource-record-sets",
                  "--hosted-zone-id", zone_id,
                  "--output", "json"
              ], text=True)
              rrset = json.loads(result)
              target = None
              for record in rrset.get("ResourceRecordSets", []):
                  if record.get("Name") == f"{host}." and record.get("Type") == "A":
                      target = record.get("AliasTarget", {}).get("DNSName")
                      break
              if target is None:
                  raise SystemExit(f"Missing Route53 A alias for {host}")
              print(f"{host} -> {target}")
              if target.rstrip('.').lower() != cf_domain.rstrip('.').lower():
                  raise SystemExit(f"Route53 alias mismatch for {host}: expected {cf_domain}, got {target}")
          PY

      - name: Invalidate CloudFront cache
        run: |
          DIST_ID=$(terraform -chdir=infra/terraform/sites/derschweigert output -raw cloudfront_distribution_id)
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"

  # A merge to main puts ffm on https://ffm-dev.derschweigert.de, never on production. The job is the dev workflow
  # itself, called with the merged commit, so there is one definition of a dev deploy. It must stay limited to a push to
  # main: the called workflow receives the AWS credentials, and a pull request's code must never run with them.
  # `ffm_dev` covers a change to the dev stack alone, which no production site needs.
  deploy-ffm-dev:
    needs: [test-ffm, check-secrets, changes]
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.check-secrets.outputs.has_secrets == 'true' &&
      (needs.changes.outputs.ffm == 'true' || needs.changes.outputs.ffm_dev == 'true')
    uses: ./.github/workflows/deploy-ffm-dev.yml
    with:
      infra: true
    secrets: inherit

  # Production ffm is released by hand (see `workflow_dispatch` at the top), never by a merge: a merge goes to dev
  # first, where it can be looked at. The run that deploys is always on `main`, so it ships only merged, tested code.
  deploy-ffm:
    needs: [test-ffm, check-secrets, changes]
    runs-on: ubuntu-latest
    # `ffm` (not `ffm_tests`) because a terraform-only change must still be applied, even though it runs no app tests.
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      needs.check-secrets.outputs.has_secrets == 'true' &&
      needs.changes.outputs.ffm == 'true'
    env:
      AWS_REGION: eu-central-1
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      # Non-secret FFM billing/access config, sourced from GitHub repository
      # variables (Settings → Secrets and variables → Actions → Variables).
      # Unset repo variables fall back to the same false/empty defaults as
      # `infra/terraform/sites/ffm/variables.tf`, so leaving them unset
      # reproduces today's production config exactly. Secret values (Stripe
      # API keys, webhook signing secret) never go here — only AWS Secrets
      # Manager ARNs that *point at* them. See sites/ffm/docs/file-map.md's
      # "Billing and Stripe integration" section for provisioning steps.
      TF_VAR_access_control_enabled: ${{ vars.FFM_ACCESS_CONTROL_ENABLED || 'false' }}
      TF_VAR_billing_enabled: ${{ vars.FFM_BILLING_ENABLED || 'false' }}
      TF_VAR_billing_sales_enabled: ${{ vars.FFM_BILLING_SALES_ENABLED || 'false' }}
      TF_VAR_billing_terms_approved: ${{ vars.FFM_BILLING_TERMS_APPROVED || 'false' }}
      TF_VAR_grandfather_cutoff: ${{ vars.FFM_GRANDFATHER_CUTOFF || '' }}
      TF_VAR_stripe_price_id: ${{ vars.FFM_STRIPE_PRICE_ID || '' }}
      TF_VAR_stripe_portal_configuration_id: ${{ vars.FFM_STRIPE_PORTAL_CONFIGURATION_ID || '' }}
      TF_VAR_stripe_secret_key_arn: ${{ vars.FFM_STRIPE_SECRET_KEY_ARN || '' }}
      TF_VAR_stripe_webhook_secret_arn: ${{ vars.FFM_STRIPE_WEBHOOK_SECRET_ARN || '' }}
      TF_VAR_admin_visits_token: ${{ secrets.FFM_ADMIN_VISITS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: eu-central-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.5.7

      - name: Ensure Terraform backend exists
        run: |
          STATE_BUCKET="derschweigert-terraform-state"
          LOCK_TABLE="derschweigert-terraform-locks"

          if ! aws s3api head-bucket --bucket "$STATE_BUCKET" >/dev/null 2>&1; then
            aws s3api create-bucket --bucket "$STATE_BUCKET" --region "$AWS_REGION" --create-bucket-configuration "LocationConstraint=$AWS_REGION"
            aws s3api put-bucket-versioning --bucket "$STATE_BUCKET" --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$STATE_BUCKET" --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          fi

          if ! aws dynamodb describe-table --table-name "$LOCK_TABLE" --region "$AWS_REGION" >/dev/null 2>&1; then
            aws dynamodb create-table \
              --table-name "$LOCK_TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region "$AWS_REGION"
          fi

      - name: Validate FFM admin visits token
        run: |
          if [ -z "$TF_VAR_admin_visits_token" ]; then
            echo "ERROR: FFM_ADMIN_VISITS_TOKEN secret is required but not set"
            exit 1
          fi

      - name: Preflight billing/access config guard
        run: infra/terraform/sites/ffm/scripts/preflight-billing-config.sh

      - name: Provision infrastructure with Terraform
        run: |
          terraform -chdir=infra/terraform/sites/ffm init -upgrade -reconfigure
          terraform -chdir=infra/terraform/sites/ffm apply -auto-approve

      - name: Build Lambda zip
        run: |
          set -x
          sudo apt-get install -y zip -q
          rm -rf sites/ffm/build
          mkdir -p sites/ffm/build
          # install manylinux wheels — compatible with Lambda's Amazon Linux 2023
          pip install \
            --platform manylinux2014_x86_64 \
            --implementation cp \
            --python-version 3.12 \
            --only-binary=:all: \
            -t sites/ffm/build/ \
            -r sites/ffm/requirements.txt
          cp -r sites/ffm/app sites/ffm/build/
          cp sites/ffm/lambda/handler.py sites/ffm/build/
          (cd sites/ffm/build && zip -r ../ffm-lambda.zip .)
          ls -lh sites/ffm/ffm-lambda.zip

      - name: Update Lambda function code
        run: |
          set -x
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="ffm-site-${ACCOUNT_ID}"
          aws s3 cp sites/ffm/ffm-lambda.zip "s3://$BUCKET/deployments/ffm-lambda.zip" --region eu-central-1
          aws lambda wait function-updated --function-name ffm-api --region eu-central-1
          aws lambda update-function-code \
            --function-name ffm-api \
            --s3-bucket "$BUCKET" \
            --s3-key deployments/ffm-lambda.zip \
            --region eu-central-1
          aws lambda wait function-updated --function-name ffm-api --region eu-central-1

      - name: Sync static assets to S3
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="ffm-site-${ACCOUNT_ID}"
          # Deliberately NOT a long max-age for any of these (previously
          # "public, max-age=31536000" == 1 year on everything but
          # index.html). Filenames here aren't content-hashed/fingerprinted,
          # so a 1-year browser cache meant any visitor who'd loaded the
          # site before a given deploy kept serving stale styles.css/main.js
          # indefinitely, mismatched against the freshly-deployed index.html
          # - exactly the class of bug that broke the desktop layout on
          # 2026-09-06 (a stale cached styles.css/main.js pairing with new
          # markup) until the user did a full cache-clearing hard reload.
          # "no-cache, must-revalidate" still lets browsers/CloudFront cache
          # these locally, but forces a conditional (ETag) revalidation on
          # every load, so a changed file is always picked up immediately
          # while an unchanged one just gets a cheap 304 instead of a full
          # re-download - the safety of no-cache with most of the
          # bandwidth savings of long-lived caching.
          aws s3 sync sites/ffm/static/ "s3://$BUCKET/" \
            --delete \
            --cache-control "no-cache, must-revalidate" \
            --exclude "index.html" \
            --exclude "*.test.js" \
            --exclude "game/calibrate.html" \
            --exclude "game/_dragon_test.html" \
            --exclude "export-sprites.html" \
            --exclude "game/hero-spritesheet.png" \
            --exclude "game/hero-spritesheet-upload.png" \
            --exclude "story/sources/*" \
            --exclude "story/references/*" \
            --exclude "story/tools/*" \
            --exclude "story/tests/*" \
            --exclude "story/preview.html" \
            --exclude "story/reel.html" \
            --exclude "story/README.md" \
            --exclude "story/ART-BIBLE.md" \
            --exclude "promo/tools/*" \
            --exclude "promo/README.md" \
            --exclude "beta/README.md"
          # Excluded keys are not deleted by sync; remove old dev artifacts explicitly.
          aws s3 rm "s3://$BUCKET/" --recursive \
            --exclude "*" --include "*.test.js" \
            --include "game/calibrate.html" --include "game/_dragon_test.html" \
            --include "export-sprites.html" --include "game/level-fiend-allocator.html" \
            --include "game/level-fiend-allocator.js" \
            --include "game/hero-spritesheet.png" \
            --include "game/hero-spritesheet-upload.png" \
            --include "story/sources/*" --include "story/references/*" \
            --include "story/tools/*" --include "story/tests/*" \
            --include "story/preview.html" --include "story/reel.html" --include "story/README.md" \
            --include "story/ART-BIBLE.md" \
            --include "promo/tools/*" --include "promo/README.md" \
            --include "beta/README.md"
          aws s3 cp sites/ffm/static/index.html \
            "s3://$BUCKET/index.html" \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?contains(Aliases.Items,'ffm.derschweigert.de')].Id | [0]" \
            --output text)
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"

      - name: Smoke test
        run: |
          set -euo pipefail
          BASE=https://ffm.derschweigert.de

          # Attaching the viewer-request function makes CloudFront redeploy the
          # distribution (minutes). Wait for it so the first deploy after a
          # Terraform change does not probe the previous configuration and see
          # 403s for /play and /promo/.
          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?contains(Aliases.Items,'ffm.derschweigert.de')].Id | [0]" \
            --output text)
          aws cloudfront wait distribution-deployed --id "$DIST_ID"

          sleep 10

          # "/" must serve the promotional landing page (CloudFront viewer-request
          # function), not the game. Keep these markers in sync with
          # sites/ffm/static/promo/index.html: the body carries id="promo-root"
          # and the page loads promo.css.
          ROOT_HTML="$RUNNER_TEMP/ffm-root.html"
          curl -sf "$BASE/" -o "$ROOT_HTML"
          grep -qi '<!doctype html' "$ROOT_HTML"
          grep -q 'promo-root' "$ROOT_HTML"
          grep -q 'promo\.css' "$ROOT_HTML"

          # /beta must serve the open-beta invite page (viewer-request function).
          # Keep the markers in sync with sites/ffm/static/beta/index.html: the
          # body carries id="beta-root" and the page loads /beta/beta.css.
          BETA_HTML="$RUNNER_TEMP/ffm-beta.html"
          curl -sf "$BASE/beta" -o "$BETA_HTML"
          grep -qi '<!doctype html' "$BETA_HTML"
          grep -q 'beta-root' "$BETA_HTML"
          grep -q '/beta/beta\.js' "$BETA_HTML"

          for path in / /promo /promo/ /promo/promo.css /promo/promo.js /beta /beta/ /beta/beta.css /beta/beta.js /play /index.html /game/main.js; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' "$BASE$path")"
            echo "$path -> $code"
            [[ "$code" == "200" ]] || { echo "::error::$path returned $code"; exit 1; }
          done

          # /play/ must NOT serve the game shell: the shell's asset references
          # are relative (styles.css, game/main.js, ...), so at /play/ they
          # would resolve to /play/... and 403. It must instead be a permanent
          # redirect to /play, where they resolve to the bucket root.
          play_slash="$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' "$BASE/play/")"
          echo "/play/ -> $play_slash"
          [[ "$play_slash" == "301 $BASE/play" ]] || {
            echo "::error::/play/ returned '$play_slash', expected '301 $BASE/play'"
            exit 1
          }

          # /play must serve the game shell, i.e. the object that loads game/main.js.
          PLAY_HTML="$RUNNER_TEMP/ffm-play.html"
          curl -sf "$BASE/play" -o "$PLAY_HTML"
          grep -q 'game/main\.js' "$PLAY_HTML"

          curl -sf "$BASE/api/health" | grep '"ok":true'

  deploy-lhc:
    needs: [test-lhc, check-secrets, changes]
    runs-on: ubuntu-latest
    # `lhc` (not `lhc_tests`) because a terraform-only change must still be applied, even though it runs no app tests.
    if: |
      github.ref == 'refs/heads/main' &&
      needs.check-secrets.outputs.has_secrets == 'true' &&
      needs.changes.outputs.lhc == 'true'
    env:
      # Landhauscheck keeps its own region: the stack predates the monorepo and lives in eu-west-1.
      AWS_REGION: eu-west-1
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      # deploy.sh guards prod with an interactive "did you test on dev?" prompt. In CI the
      # test-lhc job is that gate, so the prompt is pre-answered.
      DEPLOY_CONFIRMED: 'yes'
      # Used by deploy.sh to build releases.json from the GitHub releases API.
      GH_TOKEN: ${{ github.token }}
      # Terraform variables. A CI checkout has no terraform.tfvars (it is gitignored and
      # holds API keys), and six of this stack's variables have no default, so every value
      # comes from here. TF_VAR_aws_region is NOT cosmetic: the variable defaults to
      # eu-central-1 while this stack lives in eu-west-1, so omitting it would plan a
      # relocation of every regional resource.
      TF_VAR_aws_region: eu-west-1
      TF_VAR_app_name: basicwebapp
      TF_VAR_environment: prod
      TF_VAR_here_api_key: ${{ secrets.TF_VAR_HERE_API_KEY }}
      TF_VAR_here_browser_api_key: ${{ secrets.TF_VAR_HERE_BROWSER_API_KEY }}
      TF_VAR_db_stada_client_id: ${{ secrets.TF_VAR_DB_STADA_CLIENT_ID }}
      TF_VAR_db_stada_api_key: ${{ secrets.TF_VAR_DB_STADA_API_KEY }}
      TF_VAR_google_maps_api_key: ${{ secrets.TF_VAR_GOOGLE_MAPS_API_KEY }}
      TF_VAR_google_maps_browser_api_key: ${{ secrets.TF_VAR_GOOGLE_MAPS_BROWSER_API_KEY }}
      # Optional at runtime (the affected endpoints answer 503 when unset), but a value
      # here keeps a CI apply from blanking the feature they back.
      TF_VAR_tankerkoenig_api_key: ${{ secrets.TF_VAR_TANKERKOENIG_API_KEY }}
      TF_VAR_jira_api_key: ${{ secrets.JIRA_API_KEY }}
      TF_VAR_github_token: ${{ secrets.GH_WASTE_PAT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify Terraform variables are configured
        run: |
          missing=""
          [ -n "$TF_VAR_here_api_key" ]           || missing="$missing TF_VAR_HERE_API_KEY"
          [ -n "$TF_VAR_here_browser_api_key" ]   || missing="$missing TF_VAR_HERE_BROWSER_API_KEY"
          [ -n "$TF_VAR_db_stada_client_id" ]     || missing="$missing TF_VAR_DB_STADA_CLIENT_ID"
          [ -n "$TF_VAR_db_stada_api_key" ]       || missing="$missing TF_VAR_DB_STADA_API_KEY"
          [ -n "$TF_VAR_google_maps_api_key" ]    || missing="$missing TF_VAR_GOOGLE_MAPS_API_KEY"
          [ -n "$TF_VAR_google_maps_browser_api_key" ] || missing="$missing TF_VAR_GOOGLE_MAPS_BROWSER_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::missing required repository secrets:$missing"
            echo "see sites/landhauscheck/README.md (Deployment) for the list"
            exit 1
          fi

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: eu-west-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      # OpenTofu, not Terraform: this stack's state was created and is maintained by
      # OpenTofu (see sites/landhauscheck/docs/SYSTEM.md), unlike the other sites here.
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.11.5

      - name: Ensure Terraform backend exists
        run: |
          STATE_BUCKET="derschweigert-terraform-state"
          LOCK_TABLE="derschweigert-terraform-locks"

          if ! aws s3api head-bucket --bucket "$STATE_BUCKET" >/dev/null 2>&1; then
            aws s3api create-bucket --bucket "$STATE_BUCKET" --region eu-central-1 --create-bucket-configuration LocationConstraint=eu-central-1
            aws s3api put-bucket-versioning --bucket "$STATE_BUCKET" --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$STATE_BUCKET" --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          fi

          if ! aws dynamodb describe-table --table-name "$LOCK_TABLE" --region eu-central-1 >/dev/null 2>&1; then
            aws dynamodb create-table \
              --table-name "$LOCK_TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region eu-central-1
          fi

      - name: Install packaging tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zip

      - name: Provision infrastructure and deploy the Lambda
        run: |
          tofu -chdir=infra/terraform/sites/landhauscheck init -input=false
          bash sites/landhauscheck/scripts/deploy.sh aws --backend-only --region eu-west-1

      - name: Deploy the frontend
        run: bash sites/landhauscheck/scripts/deploy.sh aws --frontend-only --region eu-west-1

      - name: Smoke test
        run: |
          set -euo pipefail
          for url in \
            "https://landhauscheck.com/health" \
            "https://landhauscheck.com/api/v1/weather/forecast?lat=48.137&lng=11.575"; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "$url")"
            echo "$url -> $code"
            [[ "$code" == "200" ]] || { echo "::error::$url returned $code"; exit 1; }
          done

  deploy-lesen:
    # `test` runs lesen's node tests, so the deploy must wait for it; without this dependency a red lesen suite never
    # blocked the deploy.
    needs: [test, check-secrets, changes]
    runs-on: ubuntu-latest
    # !cancelled() + explicit results: `test` itself skips suites, and a skipped ancestor would otherwise skip this deploy.
    if: |
      !cancelled() &&
      needs.test.result == 'success' &&
      needs.check-secrets.result == 'success' &&
      needs.changes.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      needs.check-secrets.outputs.has_secrets == 'true' &&
      needs.changes.outputs.lesen == 'true'
    env:
      AWS_REGION: ${{ secrets.AWS_REGION || 'eu-central-1' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      TF_VAR_route53_zone_id: ${{ secrets.ROUTE53_ZONE_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set deployment target
        run: echo "Deploy targets - lesen.derschweigert.de and buchstabenzeit.derschweigert.de"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.5.7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Provision infrastructure with Terraform
        run: |
          terraform -chdir=infra/terraform/sites/lesen init -upgrade -reconfigure
          BUCKET_TAINTED=$(terraform -chdir=infra/terraform/sites/lesen state pull | jq -r '
            [
              .resources[]?
              | select(.module == "module.site" and .type == "aws_s3_bucket" and .name == "site")
              | .instances[]?
              | .status
            ] | any(. == "tainted")
          ')
          if [ "$BUCKET_TAINTED" = "true" ]; then
            terraform -chdir=infra/terraform/sites/lesen untaint module.site.aws_s3_bucket.site
          fi
          terraform -chdir=infra/terraform/sites/lesen apply -auto-approve

      - name: Upload static site files
        run: |
          BUCKET=$(terraform -chdir=infra/terraform/sites/lesen output -raw site_bucket)
          aws s3 sync sites/lesen/static/ "s3://$BUCKET/" \
            --delete \
            --cache-control "no-cache, must-revalidate" \
            --exclude "index.html"
          aws s3 cp sites/lesen/static/index.html \
            "s3://$BUCKET/index.html" \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Verify Route53 alias points to the Terraform CloudFront distribution
        run: |
          DIST_ID=$(terraform -chdir=infra/terraform/sites/lesen output -raw cloudfront_distribution_id)
          CF_DOMAIN=$(aws cloudfront get-distribution --id "$DIST_ID" --query 'Distribution.DomainName' --output text)

          python3 - "$TF_VAR_route53_zone_id" "$CF_DOMAIN" <<'PY'
          import json
          import subprocess
          import sys

          zone_id, cf_domain = sys.argv[1], sys.argv[2]
          result = subprocess.check_output([
              "aws", "route53", "list-resource-record-sets",
              "--hosted-zone-id", zone_id,
              "--output", "json"
          ], text=True)
          rrset = json.loads(result)
          host = "lesen.derschweigert.de"
          target = next(
              (
                  record.get("AliasTarget", {}).get("DNSName")
                  for record in rrset.get("ResourceRecordSets", [])
                  if record.get("Name") == f"{host}." and record.get("Type") == "A"
              ),
              None,
          )
          if target is None:
              raise SystemExit(f"Missing Route53 A alias for {host}")
          print(f"{host} -> {target}")
          if target.rstrip(".").lower() != cf_domain.rstrip(".").lower():
              raise SystemExit(f"Route53 alias mismatch for {host}: expected {cf_domain}, got {target}")
          PY

      - name: Invalidate CloudFront cache
        run: |
          DIST_ID=$(terraform -chdir=infra/terraform/sites/lesen output -raw cloudfront_distribution_id)
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"

      - name: Smoke test
        run: |
          sleep 10
          curl -sf https://lesen.derschweigert.de/ | grep -q '<title>Buchstabenzeit'

      - name: Upload marketing site files
        run: |
          test -s sites/lesen/marketing/index.html
          BUCKET=$(terraform -chdir=infra/terraform/sites/lesen output -raw marketing_site_bucket)
          aws s3 sync sites/lesen/marketing/ "s3://$BUCKET/" \
            --delete \
            --cache-control "no-cache, must-revalidate" \
            --exclude "index.html"
          for ASSET in images/buchstabenzeit-logo.png favicon.png \
            fonts/grundschrift-regular.woff2 fonts/grundschrift-bold.woff2 \
            fonts/grundschrift-LICENSE.txt; do
            aws s3 cp "sites/lesen/static/$ASSET" "s3://$BUCKET/$ASSET" \
              --cache-control "no-cache, must-revalidate"
          done
          aws s3 cp sites/lesen/marketing/index.html \
            "s3://$BUCKET/index.html" \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate marketing CloudFront cache
        run: |
          DIST_ID=$(terraform -chdir=infra/terraform/sites/lesen output -raw marketing_cloudfront_distribution_id)
          INVALIDATION_ID=$(aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*" --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DIST_ID" --id "$INVALIDATION_ID"

      - name: Smoke test marketing site
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 10 \
            https://buchstabenzeit.derschweigert.de/ | grep -q '<title>Buchstabenzeit'
