name: Deploy to production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allows re-running the deploy from the Actions UI (same `main` ref, no new
  # commit needed) after changing the non-secret FFM billing/access
  # repository variables below — e.g. to apply a newly provisioned Stripe ID
  # without a code push. Does not change what gets deployed or any default.
  workflow_dispatch: {}

permissions:
  contents: read
  # Read-only on pull request metadata, for the changed-file list behind the site gates below.
  pull-requests: read

jobs:
  # Which sites a change touches, and whether it touches their code or only their infrastructure. Required checks make a
  # skipped job awkward and a workflow that never starts leaves its checks "expected" forever, so the gates below are
  # explicit outputs that every other job reads. Anything uncertain reports every site as changed, because over-testing
  # is cheap and a silently untested deploy is not.
  changes:
    runs-on: ubuntu-latest
    outputs:
      ffm_tests: ${{ steps.diff.outputs.ffm_tests }}
      ffm: ${{ steps.diff.outputs.ffm }}
      lesen: ${{ steps.diff.outputs.lesen }}
      site: ${{ steps.diff.outputs.site }}
      lhc_tests: ${{ steps.diff.outputs.lhc_tests }}
      lhc: ${{ steps.diff.outputs.lhc }}
    steps:
      - id: diff
        name: List the changed paths
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ffm_tests=false; ffm=false; lesen=false; site=false; lhc_tests=false; lhc=false
          changed=""; listed=true
          if [ -n "${PR:-}" ]; then
            # The files endpoint pages through every file, so nothing is truncated.
            changed="$(gh api --paginate --slurp "repos/$REPO/pulls/$PR/files?per_page=100" \
                        --jq '.[][] | .filename' 2>/dev/null)" || listed=false
          elif [ -n "${BASE:-}" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            compared="$(gh api "repos/$REPO/compare/$BASE...$HEAD_SHA" 2>/dev/null)" || listed=false
            changed="$(printf '%s' "$compared" | jq -r '.files[]?.filename' 2>/dev/null)" || listed=false
            # GitHub caps a compare at 300 files; a truncated list says nothing about the rest.
            if printf '%s' "$compared" | jq -e '(.files | length) >= 300' >/dev/null 2>&1; then listed=false; fi
          else
            listed=false
          fi
          if [ "$listed" != true ] || [ -z "$changed" ]; then
            echo "::warning::could not list every changed path; treating every site as changed"
            ffm_tests=true; ffm=true; lesen=true; site=true; lhc_tests=true; lhc=true
          else
            # Application code changes need that site's tests and deploy. A site's own terraform needs its deploy but not
            # its tests, because the application did not change. Shared modules and anything else under infra/ can reach
            # any site, so they deploy every site.
            while IFS= read -r path; do
              case "$path" in
                sites/ffm/*) ffm_tests=true; ffm=true ;;
                sites/lesen/*) lesen=true ;;
                sites/derschweigert/*) site=true ;;
                sites/landhauscheck/*) lhc_tests=true; lhc=true ;;
                infra/terraform/sites/ffm/*) ffm=true ;;
                infra/terraform/sites/lesen/*) lesen=true ;;
                infra/terraform/sites/derschweigert/*) site=true ;;
                infra/terraform/sites/landhauscheck/*|infra/terraform/sites/landhauscheck-dev/*) lhc=true ;;
                infra/*) ffm=true; lesen=true; site=true; lhc=true ;;
              esac
            done <<< "$changed"
            # A workflow change runs every test job so the pipeline itself is exercised, but it does not deploy a site
            # whose files did not change: a CI tweak must not apply terraform to every site.
            if grep -Eq '^\.github/workflows/' <<< "$changed"; then
              echo "::notice::the workflow changed; running every test job"
              ffm_tests=true
              lhc_tests=true
            fi
          fi
          echo "changed -> ffm_tests=$ffm_tests deploy ffm=$ffm lesen=$lesen site=$site lhc_tests=$lhc_tests deploy lhc=$lhc"
          printf 'ffm_tests=%s\nffm=%s\nlesen=%s\nsite=%s\nlhc_tests=%s\nlhc=%s\n' \
            "$ffm_tests" "$ffm" "$lesen" "$site" "$lhc_tests" "$lhc" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q
        env:
          PYTHONPATH: ${{ github.workspace }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test sites/lesen/tests/*.test.mjs

  test-ffm:
    needs: [changes]
    # always() so a failed `changes` job shows up here as a red check instead of leaving this required check skipped.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to report an untested ffm as passing
        if: needs.changes.outputs.ffm_tests == ''
        run: |
          echo "::error::the changes job produced no result, so nothing proves sites/ffm was tested"
          exit 1
      - name: sites/ffm code is unchanged
        if: needs.changes.outputs.ffm_tests == 'false'
        run: echo "::notice::sites/ffm code unchanged; its tests are skipped for this change"
      - uses: actions/checkout@v4
        if: needs.changes.outputs.ffm_tests == 'true'
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.ffm_tests == 'true'
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
        if: needs.changes.outputs.ffm_tests == 'true'
      - run: pip install -r sites/ffm/requirements-dev.txt -q
        if: needs.changes.outputs.ffm_tests == 'true'
      - run: SECRET_KEY=ci-test-key pytest sites/ffm/tests/ -q --tb=short
        if: needs.changes.outputs.ffm_tests == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.ffm_tests == 'true'
        with:
          node-version: '22'
      - run: node --test sites/ffm/static/game/*.test.js
        if: needs.changes.outputs.ffm_tests == 'true'

  test-lhc:
    needs: [changes]
    # always() so a failed `changes` job shows up here as a red check instead of leaving this required check skipped.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to report an untested landhauscheck as passing
        if: needs.changes.outputs.lhc_tests == ''
        run: |
          echo "::error::the changes job produced no result, so nothing proves sites/landhauscheck was tested"
          exit 1
      - name: sites/landhauscheck code is unchanged
        if: needs.changes.outputs.lhc_tests == 'false'
        run: echo "::notice::sites/landhauscheck code unchanged; its tests are skipped for this change"
      - uses: actions/checkout@v4
        if: needs.changes.outputs.lhc_tests == 'true'
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.lhc_tests == 'true'
        with:
          python-version: '3.12'
      - name: Install backend dev dependencies
        if: needs.changes.outputs.lhc_tests == 'true'
        run: python -m pip install -r sites/landhauscheck/requirements-dev.txt
      # Scope matches the pre-migration CI (backend package only); scripts/ was never linted.
      - name: Lint
        if: needs.changes.outputs.lhc_tests == 'true'
        run: |
          cd sites/landhauscheck
          ruff check app tests alembic
      # tests/smoke needs a running BASE_URL, so it is a deploy-time check, not a unit test.
      - name: Backend unit tests
        if: needs.changes.outputs.lhc_tests == 'true'
        run: PYTHONPATH=sites/landhauscheck pytest sites/landhauscheck/tests -q --ignore=sites/landhauscheck/tests/smoke
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.lhc_tests == 'true'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sites/landhauscheck/frontend/package-lock.json
      - name: Frontend unit tests
        if: needs.changes.outputs.lhc_tests == 'true'
        run: |
          cd sites/landhauscheck/frontend
          npm ci
          npm test
      - name: Frontend build
        if: needs.changes.outputs.lhc_tests == 'true'
        run: |
          cd sites/landhauscheck/frontend
          npm run build

  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      has_secrets: ${{ steps.check.outputs.has_secrets }}
    steps:
      - id: check
        run: |
          if [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ] && [ -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: [test, check-secrets, changes]
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/main' &&
      needs.check-secrets.outputs.has_secrets == 'true' &&
      needs.changes.outputs.site == 'true'
    env:
      AWS_REGION: ${{ secrets.AWS_REGION || 'eu-central-1' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      TF_VAR_route53_zone_id: ${{ secrets.ROUTE53_ZONE_ID }}
      TF_VAR_pin_protection_enabled: ${{ vars.DERSCHWEIGERT_PIN_PROTECTION_ENABLED || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set deployment target
        run: echo "Deploy target - derschweigert.de"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Ensure Terraform backend exists
        run: |
          STATE_BUCKET="derschweigert-terraform-state"
          LOCK_TABLE="derschweigert-terraform-locks"

          if ! aws s3api head-bucket --bucket "$STATE_BUCKET" >/dev/null 2>&1; then
            if [ "$AWS_REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$STATE_BUCKET" --region "$AWS_REGION"
            else
              aws s3api create-bucket --bucket "$STATE_BUCKET" --region "$AWS_REGION" --create-bucket-configuration "LocationConstraint=$AWS_REGION"
            fi
            aws s3api put-bucket-versioning --bucket "$STATE_BUCKET" --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$STATE_BUCKET" --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          fi

          if ! aws dynamodb describe-table --table-name "$LOCK_TABLE" --region "$AWS_REGION" >/dev/null 2>&1; then
            aws dynamodb create-table \
              --table-name "$LOCK_TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region "$AWS_REGION"
          fi

      - name: Provision infrastructure with Terraform
        run: |
          terraform -chdir=infra/terraform/sites/derschweigert init -upgrade -reconfigure
          terraform -chdir=infra/terraform/sites/derschweigert apply -auto-approve

      - name: Upload static site files
        run: |
          BUCKET=$(terraform -chdir=infra/terraform/sites/derschweigert output -raw site_bucket)
          aws s3 sync sites/derschweigert/templates "s3://$BUCKET" --delete
          aws s3 sync sites/derschweigert/static "s3://$BUCKET/static" --delete

      - name: Verify Route53 aliases point to the Terraform CloudFront distribution
        run: |
          DIST_ID=$(terraform -chdir=infra/terraform/sites/derschweigert output -raw cloudfront_distribution_id)
          CF_DOMAIN=$(aws cloudfront get-distribution --id "$DIST_ID" --query 'Distribution.DomainName' --output text)

          python3 - "$TF_VAR_route53_zone_id" "$CF_DOMAIN" <<'PY'
          import json
          import subprocess
          import sys

          zone_id, cf_domain = sys.argv[1], sys.argv[2]
          for host in ["derschweigert.de", "www.derschweigert.de"]:
              result = subprocess.check_output([
                  "aws", "route53", "list-resource-record-sets",
                  "--hosted-zone-id", zone_id,
                  "--output", "json"
              ], text=True)
              rrset = json.loads(result)
              target = None
              for record in rrset.get("ResourceRecordSets", []):
                  if record.get("Name") == f"{host}." and record.get("Type") == "A":
                      target = record.get("AliasTarget", {}).get("DNSName")
                      break
              if target is None:
                  raise SystemExit(f"Missing Route53 A alias for {host}")
              print(f"{host} -> {target}")
              if target.rstrip('.').lower() != cf_domain.rstrip('.').lower():
                  raise SystemExit(f"Route53 alias mismatch for {host}: expected {cf_domain}, got {target}")
          PY

      - name: Invalidate CloudFront cache
        run: |
          DIST_ID=$(terraform -chdir=infra/terraform/sites/derschweigert output -raw cloudfront_distribution_id)
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"

  deploy-ffm:
    needs: [test-ffm, check-secrets, changes]
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/main' &&
      needs.check-secrets.outputs.has_secrets == 'true' &&
      needs.changes.outputs.ffm_tests == 'true'
    env:
      AWS_REGION: eu-central-1
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      # Non-secret FFM billing/access config, sourced from GitHub repository
      # variables (Settings → Secrets and variables → Actions → Variables).
      # Unset repo variables fall back to the same false/empty defaults as
      # `infra/terraform/sites/ffm/variables.tf`, so leaving them unset
      # reproduces today's production config exactly. Secret values (Stripe
      # API keys, webhook signing secret) never go here — only AWS Secrets
      # Manager ARNs that *point at* them. See sites/ffm/README.md's
      # "Billing and Stripe integration" section for provisioning steps.
      TF_VAR_access_control_enabled: ${{ vars.FFM_ACCESS_CONTROL_ENABLED || 'false' }}
      TF_VAR_billing_enabled: ${{ vars.FFM_BILLING_ENABLED || 'false' }}
      TF_VAR_billing_sales_enabled: ${{ vars.FFM_BILLING_SALES_ENABLED || 'false' }}
      TF_VAR_billing_terms_approved: ${{ vars.FFM_BILLING_TERMS_APPROVED || 'false' }}
      TF_VAR_grandfather_cutoff: ${{ vars.FFM_GRANDFATHER_CUTOFF || '' }}
      TF_VAR_stripe_price_id: ${{ vars.FFM_STRIPE_PRICE_ID || '' }}
      TF_VAR_stripe_portal_configuration_id: ${{ vars.FFM_STRIPE_PORTAL_CONFIGURATION_ID || '' }}
      TF_VAR_stripe_secret_key_arn: ${{ vars.FFM_STRIPE_SECRET_KEY_ARN || '' }}
      TF_VAR_stripe_webhook_secret_arn: ${{ vars.FFM_STRIPE_WEBHOOK_SECRET_ARN || '' }}
      TF_VAR_admin_visits_token: ${{ secrets.FFM_ADMIN_VISITS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: eu-central-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Ensure Terraform backend exists
        run: |
          STATE_BUCKET="derschweigert-terraform-state"
          LOCK_TABLE="derschweigert-terraform-locks"

          if ! aws s3api head-bucket --bucket "$STATE_BUCKET" >/dev/null 2>&1; then
            aws s3api create-bucket --bucket "$STATE_BUCKET" --region "$AWS_REGION" --create-bucket-configuration "LocationConstraint=$AWS_REGION"
            aws s3api put-bucket-versioning --bucket "$STATE_BUCKET" --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$STATE_BUCKET" --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          fi

          if ! aws dynamodb describe-table --table-name "$LOCK_TABLE" --region "$AWS_REGION" >/dev/null 2>&1; then
            aws dynamodb create-table \
              --table-name "$LOCK_TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region "$AWS_REGION"
          fi

      - name: Validate FFM admin visits token
        run: |
          if [ -z "$TF_VAR_admin_visits_token" ]; then
            echo "ERROR: FFM_ADMIN_VISITS_TOKEN secret is required but not set"
            exit 1
          fi

      - name: Preflight billing/access config guard
        run: infra/terraform/sites/ffm/scripts/preflight-billing-config.sh

      - name: Provision infrastructure with Terraform
        run: |
          terraform -chdir=infra/terraform/sites/ffm init -upgrade -reconfigure
          terraform -chdir=infra/terraform/sites/ffm apply -auto-approve

      - name: Build Lambda zip
        run: |
          set -x
          sudo apt-get install -y zip -q
          rm -rf sites/ffm/build
          mkdir -p sites/ffm/build
          # install manylinux wheels — compatible with Lambda's Amazon Linux 2023
          pip install \
            --platform manylinux2014_x86_64 \
            --implementation cp \
            --python-version 3.12 \
            --only-binary=:all: \
            -t sites/ffm/build/ \
            -r sites/ffm/requirements.txt
          cp -r sites/ffm/app sites/ffm/build/
          cp sites/ffm/lambda/handler.py sites/ffm/build/
          (cd sites/ffm/build && zip -r ../ffm-lambda.zip .)
          ls -lh sites/ffm/ffm-lambda.zip

      - name: Update Lambda function code
        run: |
          set -x
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="ffm-site-${ACCOUNT_ID}"
          aws s3 cp sites/ffm/ffm-lambda.zip "s3://$BUCKET/deployments/ffm-lambda.zip" --region eu-central-1
          aws lambda wait function-updated --function-name ffm-api --region eu-central-1
          aws lambda update-function-code \
            --function-name ffm-api \
            --s3-bucket "$BUCKET" \
            --s3-key deployments/ffm-lambda.zip \
            --region eu-central-1
          aws lambda wait function-updated --function-name ffm-api --region eu-central-1

      - name: Sync static assets to S3
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="ffm-site-${ACCOUNT_ID}"
          # Deliberately NOT a long max-age for any of these (previously
          # "public, max-age=31536000" == 1 year on everything but
          # index.html). Filenames here aren't content-hashed/fingerprinted,
          # so a 1-year browser cache meant any visitor who'd loaded the
          # site before a given deploy kept serving stale styles.css/main.js
          # indefinitely, mismatched against the freshly-deployed index.html
          # - exactly the class of bug that broke the desktop layout on
          # 2026-09-06 (a stale cached styles.css/main.js pairing with new
          # markup) until the user did a full cache-clearing hard reload.
          # "no-cache, must-revalidate" still lets browsers/CloudFront cache
          # these locally, but forces a conditional (ETag) revalidation on
          # every load, so a changed file is always picked up immediately
          # while an unchanged one just gets a cheap 304 instead of a full
          # re-download - the safety of no-cache with most of the
          # bandwidth savings of long-lived caching.
          aws s3 sync sites/ffm/static/ "s3://$BUCKET/" \
            --delete \
            --cache-control "no-cache, must-revalidate" \
            --exclude "index.html" \
            --exclude "*.test.js" \
            --exclude "game/calibrate.html" \
            --exclude "game/_dragon_test.html" \
            --exclude "export-sprites.html"
          # Excluded keys are not deleted by sync; remove old dev artifacts explicitly.
          aws s3 rm "s3://$BUCKET/" --recursive \
            --exclude "*" --include "*.test.js" \
            --include "game/calibrate.html" --include "game/_dragon_test.html" \
            --include "export-sprites.html" --include "game/level-fiend-allocator.html" \
            --include "game/level-fiend-allocator.js"
          aws s3 cp sites/ffm/static/index.html \
            "s3://$BUCKET/index.html" \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?contains(Aliases.Items,'ffm.derschweigert.de')].Id | [0]" \
            --output text)
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"

      - name: Smoke test
        run: |
          sleep 10
          curl -sf https://ffm.derschweigert.de/ > /dev/null
          curl -sf https://ffm.derschweigert.de/api/health | grep '"ok":true'

  deploy-lhc:
    needs: [test-lhc, check-secrets, changes]
    runs-on: ubuntu-latest
    # `lhc` (not `lhc_tests`) because a terraform-only change must still be applied, even though it runs no app tests.
    if: |
      github.ref == 'refs/heads/main' &&
      needs.check-secrets.outputs.has_secrets == 'true' &&
      needs.changes.outputs.lhc == 'true'
    env:
      # Landhauscheck keeps its own region: the stack predates the monorepo and lives in eu-west-1.
      AWS_REGION: eu-west-1
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      # deploy.sh guards prod with an interactive "did you test on dev?" prompt. In CI the
      # test-lhc job is that gate, so the prompt is pre-answered.
      DEPLOY_CONFIRMED: 'yes'
      # Used by deploy.sh to build releases.json from the GitHub releases API.
      GH_TOKEN: ${{ github.token }}
      # Terraform variables. A CI checkout has no terraform.tfvars (it is gitignored and
      # holds API keys), and six of this stack's variables have no default, so every value
      # comes from here. TF_VAR_aws_region is NOT cosmetic: the variable defaults to
      # eu-central-1 while this stack lives in eu-west-1, so omitting it would plan a
      # relocation of every regional resource.
      TF_VAR_aws_region: eu-west-1
      TF_VAR_app_name: basicwebapp
      TF_VAR_environment: prod
      TF_VAR_here_api_key: ${{ secrets.TF_VAR_HERE_API_KEY }}
      TF_VAR_here_browser_api_key: ${{ secrets.TF_VAR_HERE_BROWSER_API_KEY }}
      TF_VAR_db_stada_client_id: ${{ secrets.TF_VAR_DB_STADA_CLIENT_ID }}
      TF_VAR_db_stada_api_key: ${{ secrets.TF_VAR_DB_STADA_API_KEY }}
      TF_VAR_google_maps_api_key: ${{ secrets.TF_VAR_GOOGLE_MAPS_API_KEY }}
      TF_VAR_google_maps_browser_api_key: ${{ secrets.TF_VAR_GOOGLE_MAPS_BROWSER_API_KEY }}
      # Optional at runtime (the affected endpoints answer 503 when unset), but a value
      # here keeps a CI apply from blanking the feature they back.
      TF_VAR_tankerkoenig_api_key: ${{ secrets.TF_VAR_TANKERKOENIG_API_KEY }}
      TF_VAR_jira_api_key: ${{ secrets.JIRA_API_KEY }}
      TF_VAR_github_token: ${{ secrets.GH_WASTE_PAT }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify Terraform variables are configured
        run: |
          missing=""
          [ -n "$TF_VAR_here_api_key" ]           || missing="$missing TF_VAR_HERE_API_KEY"
          [ -n "$TF_VAR_here_browser_api_key" ]   || missing="$missing TF_VAR_HERE_BROWSER_API_KEY"
          [ -n "$TF_VAR_db_stada_client_id" ]     || missing="$missing TF_VAR_DB_STADA_CLIENT_ID"
          [ -n "$TF_VAR_db_stada_api_key" ]       || missing="$missing TF_VAR_DB_STADA_API_KEY"
          [ -n "$TF_VAR_google_maps_api_key" ]    || missing="$missing TF_VAR_GOOGLE_MAPS_API_KEY"
          [ -n "$TF_VAR_google_maps_browser_api_key" ] || missing="$missing TF_VAR_GOOGLE_MAPS_BROWSER_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::missing required repository secrets:$missing"
            echo "see sites/landhauscheck/README.md (Deployment) for the list"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: eu-west-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      # OpenTofu, not Terraform: this stack's state was created and is maintained by
      # OpenTofu (see sites/landhauscheck/docs/SYSTEM.md), unlike the other sites here.
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.11.5

      - name: Ensure Terraform backend exists
        run: |
          STATE_BUCKET="derschweigert-terraform-state"
          LOCK_TABLE="derschweigert-terraform-locks"

          if ! aws s3api head-bucket --bucket "$STATE_BUCKET" >/dev/null 2>&1; then
            aws s3api create-bucket --bucket "$STATE_BUCKET" --region eu-central-1 --create-bucket-configuration LocationConstraint=eu-central-1
            aws s3api put-bucket-versioning --bucket "$STATE_BUCKET" --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$STATE_BUCKET" --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          fi

          if ! aws dynamodb describe-table --table-name "$LOCK_TABLE" --region eu-central-1 >/dev/null 2>&1; then
            aws dynamodb create-table \
              --table-name "$LOCK_TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region eu-central-1
          fi

      - name: Install packaging tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zip

      - name: Provision infrastructure and deploy the Lambda
        run: |
          tofu -chdir=infra/terraform/sites/landhauscheck init -input=false
          bash sites/landhauscheck/scripts/deploy.sh aws --backend-only --region eu-west-1

      - name: Deploy the frontend
        run: bash sites/landhauscheck/scripts/deploy.sh aws --frontend-only --region eu-west-1

      - name: Smoke test
        run: |
          set -euo pipefail
          for url in \
            "https://landhauscheck.com/health" \
            "https://landhauscheck.com/api/v1/weather/forecast?lat=48.137&lng=11.575"; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "$url")"
            echo "$url -> $code"
            [[ "$code" == "200" ]] || { echo "::error::$url returned $code"; exit 1; }
          done

  deploy-lesen:
    needs: [check-secrets, changes]
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/main' &&
      needs.check-secrets.outputs.has_secrets == 'true' &&
      needs.changes.outputs.lesen == 'true'
    env:
      AWS_REGION: ${{ secrets.AWS_REGION || 'eu-central-1' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      TF_VAR_route53_zone_id: ${{ secrets.ROUTE53_ZONE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Set deployment target
        run: echo "Deploy target - lesen.derschweigert.de"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Provision infrastructure with Terraform
        run: |
          terraform -chdir=infra/terraform/sites/lesen init -upgrade -reconfigure
          BUCKET_TAINTED=$(terraform -chdir=infra/terraform/sites/lesen state pull | jq -r '
            [
              .resources[]?
              | select(.module == "module.site" and .type == "aws_s3_bucket" and .name == "site")
              | .instances[]?
              | .status
            ] | any(. == "tainted")
          ')
          if [ "$BUCKET_TAINTED" = "true" ]; then
            terraform -chdir=infra/terraform/sites/lesen untaint module.site.aws_s3_bucket.site
          fi
          terraform -chdir=infra/terraform/sites/lesen apply -auto-approve

      - name: Upload static site files
        run: |
          BUCKET=$(terraform -chdir=infra/terraform/sites/lesen output -raw site_bucket)
          aws s3 sync sites/lesen/static/ "s3://$BUCKET/" \
            --delete \
            --cache-control "no-cache, must-revalidate" \
            --exclude "index.html"
          aws s3 cp sites/lesen/static/index.html \
            "s3://$BUCKET/index.html" \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Verify Route53 alias points to the Terraform CloudFront distribution
        run: |
          DIST_ID=$(terraform -chdir=infra/terraform/sites/lesen output -raw cloudfront_distribution_id)
          CF_DOMAIN=$(aws cloudfront get-distribution --id "$DIST_ID" --query 'Distribution.DomainName' --output text)

          python3 - "$TF_VAR_route53_zone_id" "$CF_DOMAIN" <<'PY'
          import json
          import subprocess
          import sys

          zone_id, cf_domain = sys.argv[1], sys.argv[2]
          result = subprocess.check_output([
              "aws", "route53", "list-resource-record-sets",
              "--hosted-zone-id", zone_id,
              "--output", "json"
          ], text=True)
          rrset = json.loads(result)
          host = "lesen.derschweigert.de"
          target = next(
              (
                  record.get("AliasTarget", {}).get("DNSName")
                  for record in rrset.get("ResourceRecordSets", [])
                  if record.get("Name") == f"{host}." and record.get("Type") == "A"
              ),
              None,
          )
          if target is None:
              raise SystemExit(f"Missing Route53 A alias for {host}")
          print(f"{host} -> {target}")
          if target.rstrip(".").lower() != cf_domain.rstrip(".").lower():
              raise SystemExit(f"Route53 alias mismatch for {host}: expected {cf_domain}, got {target}")
          PY

      - name: Invalidate CloudFront cache
        run: |
          DIST_ID=$(terraform -chdir=infra/terraform/sites/lesen output -raw cloudfront_distribution_id)
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"

      - name: Smoke test
        run: |
          sleep 10
          curl -sf https://lesen.derschweigert.de/ | grep -q '<title>Buchstabenzeit'
