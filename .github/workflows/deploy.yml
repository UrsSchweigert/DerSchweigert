name: Deploy to production

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set deployment target
        run: echo "Deploy target: derschweigert.de"
      - name: Placeholder deploy step
        run: |
          echo "Add your real hosting deployment here: ECS, App Runner, EC2, or a CDN pipeline."
          echo "Production DNS is already created in Route53 for derschweigert.de."
