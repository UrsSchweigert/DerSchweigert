name: 'Arithmo Slayer: native build gate'

on:
  # After a merge to main only. The merged tree is what a release is cut from, and nothing here runs on a pull request
  # or on a harness run branch: those PRs therefore never wait for a native status and never spend macOS minutes
  # (billed at ten times the Linux rate). The aggregate job keeps its historical `ffm-native` check name and
  # must not become a required check in any ruleset, because no pull request produces it.
  push:
    branches: [main]
    paths:
      - 'sites/ffm/**'
      - 'tools/ios/**'
      - '.github/workflows/arithmoslayer-native.yml'
      - '.github/workflows/arithmoslayer-build-artifacts.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sites/ffm/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sites/ffm/mobile/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - run: npm test
      - run: npm run build:debug
      - uses: actions/upload-artifact@v4
        with:
          name: ffm-debug-apk
          path: sites/ffm/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    # The macOS job bills at ten times the Linux rate, so it is deliberately limited to this one event: a merge to
    # main. A game or JavaScript change still gets the Android build above and the repository's Node checks.
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sites/ffm/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sites/ffm/mobile/package-lock.json
      - run: xcodebuild -version
      - run: npm ci
      - run: npm run copy-assets
      - run: ./node_modules/.bin/cap sync ios
      - name: Compile without signing
        run: |
          set -euo pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ffm-derived" \
            CODE_SIGNING_ALLOWED=NO build

  ffm-native:
    needs: [android, ios]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require both native builds
        env:
          ANDROID: ${{ needs.android.result }}
          IOS: ${{ needs.ios.result }}
        run: |
          set -euo pipefail
          if [ "$ANDROID" = success ] && [ "$IOS" = success ]; then
            echo "Android and iOS native builds passed for the merged revision."
          else
            echo "::error::a native build is missing, pending, skipped, cancelled or failed (android=$ANDROID ios=$IOS)"
            exit 1
          fi
