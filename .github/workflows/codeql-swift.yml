name: 'CodeQL: Swift'

# Swift analysis is the one language CodeQL default setup cannot handle here: its autobuilder runs
# xcodebuild/swift build directly, and both Capacitor projects resolve their SwiftPM dependencies from
# node_modules, which the CodeQL job never installs. This workflow keeps default setup for the other
# languages and supplies the manual build steps Swift needs.
on:
  # A macOS runner bills at ten times the Linux rate, so Swift analysis follows the native build gates
  # and runs only on a merge to main, plus a weekly refresh that keeps the configuration current when
  # the iOS projects are untouched.
  push:
    branches: [main]
    paths:
      - 'sites/lesen/ios/**'
      - 'sites/ffm/mobile/ios/**'
      - 'sites/lesen/package.json'
      - 'sites/lesen/package-lock.json'
      - 'sites/ffm/mobile/package.json'
      - 'sites/ffm/mobile/package-lock.json'
      - 'tools/ios/**'
      - '.github/workflows/codeql-swift.yml'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze (swift)
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            sites/lesen/package-lock.json
            sites/ffm/mobile/package-lock.json
      - name: Cache Swift Package Manager checkouts
        # Only the shared repository cache is reused. DerivedData is deliberately not cached: an
        # incremental build would skip compiling unchanged sources and CodeQL would extract an
        # incomplete database.
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('sites/lesen/ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'sites/ffm/mobile/ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-
      - name: Install Capacitor dependencies
        run: |
          set -euo pipefail
          npm ci --prefix sites/lesen
          npm ci --prefix sites/ffm/mobile
      - uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual
      - name: Build the iOS apps so CodeQL can extract Swift
        run: |
          set -euo pipefail
          xcodebuild -project sites/lesen/ios/App/App.xcodeproj -scheme App \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/codeql-lesen" \
            CODE_SIGNING_ALLOWED=NO build
          xcodebuild -project sites/ffm/mobile/ios/App/App.xcodeproj -scheme App \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/codeql-ffm" \
            CODE_SIGNING_ALLOWED=NO build
      - uses: github/codeql-action/analyze@v4
        with:
          # Same category the failed default-setup Swift analysis used, so the successful upload
          # replaces that configuration's status instead of adding a second Swift configuration.
          category: '/language:swift'
