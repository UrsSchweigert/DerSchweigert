name: Buchstabenzeit native build gate

on:
  # After a merge to main only, matching ffm-native.yml. Nothing runs on a pull request or a harness run branch, so
  # neither PRs nor run branches wait for this status, and macOS minutes are spent only on the merged tree.
  # `lesen-native` must not be a required check in any ruleset, because no pull request produces it.
  push:
    branches: [main]
    paths:
      - 'sites/lesen/**'
      - 'tools/ios/**'
      - '.github/workflows/lesen-native.yml'
      - '.github/workflows/lesen-build-artifacts.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sites/lesen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sites/lesen/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - run: npm run build:debug
      - uses: actions/upload-artifact@v4
        with:
          name: lesen-debug-apk
          path: sites/lesen/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    # The macOS job bills at ten times the Linux rate, so it is limited to this one event: a merge to main.
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sites/lesen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sites/lesen/package-lock.json
      - run: xcodebuild -version
      - run: npm ci
      - run: npm run copy-assets
      - name: Generate the prerequisite probe only until the real iOS project exists
        run: |
          set -euo pipefail
          if [ ! -d ios/App/App.xcodeproj ]; then
            ./node_modules/.bin/cap add ios
          fi
          ./node_modules/.bin/cap sync ios
      - name: Compile the real project or prerequisite probe without signing
        run: |
          set -euo pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/lesen-derived" \
            CODE_SIGNING_ALLOWED=NO build

  lesen-native:
    needs: [android, ios]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require both native builds
        env:
          ANDROID: ${{ needs.android.result }}
          IOS: ${{ needs.ios.result }}
        run: |
          set -euo pipefail
          if [ "$ANDROID" = success ] && [ "$IOS" = success ]; then
            echo "Android and iOS native builds passed for the merged revision."
          else
            echo "::error::a native build is missing, pending, skipped, cancelled or failed (android=$ANDROID ios=$IOS)"
            exit 1
          fi
