name: Buchstabenzeit native build gate

# On demand only (Actions > Run workflow): the Android and macOS builds are the most expensive jobs in the repository
# (macOS bills at ten times the Linux rate), and nothing runs them automatically. Run it before a release or after a
# change to the native project. A ruleset must not require `lesen-native`, because no pull request or push runs it.
on:
  workflow_dispatch:
    inputs:
      ios:
        description: Also build the iOS simulator app on macOS (ten times the Linux rate)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.select.outputs.needed }}
      native: ${{ steps.select.outputs.native }}
    steps:
      - id: select
        env:
          IOS: ${{ inputs.ios }}
        run: |
          echo "needed=true" >> "$GITHUB_OUTPUT"
          echo "native=$IOS" >> "$GITHUB_OUTPUT"

  android:
    needs: changes
    if: needs.changes.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sites/lesen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sites/lesen/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - run: npm run build:debug
      - uses: actions/upload-artifact@v4
        with:
          name: lesen-debug-apk
          path: sites/lesen/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    needs: changes
    # A macOS runner bills at ten times the Linux rate, so the iOS build is opt-out on dispatch.
    if: needs.changes.outputs.native == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sites/lesen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sites/lesen/package-lock.json
      - run: xcodebuild -version
      - run: npm ci
      - run: npm run copy-assets
      - name: Generate the prerequisite probe only until the real iOS project exists
        run: |
          set -euo pipefail
          if [ ! -d ios/App/App.xcodeproj ]; then
            ./node_modules/.bin/cap add ios
          fi
          ./node_modules/.bin/cap sync ios
      - name: Compile the real project or prerequisite probe without signing
        run: |
          set -euo pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/lesen-derived" \
            CODE_SIGNING_ALLOWED=NO build

  lesen-native:
    needs: [changes, android, ios]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the native builds the changed inputs need
        env:
          NEEDED: ${{ needs.changes.outputs.needed }}
          CHANGES: ${{ needs.changes.result }}
          ANDROID: ${{ needs.android.result }}
          IOS: ${{ needs.ios.result }}
          NATIVE: ${{ needs.changes.outputs.native }}
        run: |
          set -euo pipefail
          if [ "$CHANGES" != success ]; then
            echo "::error::could not determine whether native builds are required"
            exit 1
          fi
          if [ "$NEEDED" = false ]; then
            echo "Buchstabenzeit native inputs are unchanged."
          elif [ "$NEEDED" = true ] && [ "$ANDROID" = success ] && { [ "${NATIVE:-}" != true ] || [ "$IOS" = success ]; }; then
            echo "Native builds passed for the inputs that changed."
          else
            echo "::error::native builds are missing, pending, skipped, cancelled or failed"
            exit 1
          fi
