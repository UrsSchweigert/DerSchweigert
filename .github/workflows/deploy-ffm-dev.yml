name: 'ffm: deploy to dev (manual)'

# Deploys ONE branch of this repo to https://ffm-dev.derschweigert.de so a change can be
# tried against real AWS before it is merged to main (a merge to main deploys production).
#
# Manual only, on purpose. The repository is public and this job holds AWS credentials, so it
# must never start from a pull request: a PR's code would run with them. workflow_dispatch can
# only be started by someone with write access, from a branch of this repository.
#
# The committed configuration cannot touch production: its Terraform state is ffm/dev/terraform.tfstate,
# every resource it names starts with `ffm-dev`, and it never reads the FFM_* billing variables. But the
# job runs whatever the chosen branch contains (Terraform, pip install, build scripts) with the same AWS
# credentials as the production deploy, so only dispatch a branch whose changes you have read.
# Run it from the Actions tab: "ffm: deploy to dev (manual)" -> Run workflow -> pick the branch.

on:
  workflow_dispatch:
    inputs:
      infra:
        description: 'Apply the Terraform stack first (untick for a faster code-only redeploy)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # One deploy at a time: two Terraform applies against one state would just fight over its lock.
  # Queue rather than cancel, so a running apply is never killed half-way.
  group: ffm-dev-deploy
  cancel-in-progress: false

jobs:
  deploy-ffm-dev:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-central-1
      BASE: https://ffm-dev.derschweigert.de
      FUNCTION: ffm-dev-api
    steps:
      - name: Refuse to run without AWS credentials
        env:
          KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$KEY" ] || [ -z "$SECRET" ]; then
            echo "::error::AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY are not available to this run"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: eu-central-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.5.7

      - name: Provision the dev infrastructure with Terraform
        if: inputs.infra
        run: |
          terraform -chdir=infra/terraform/sites/ffm-dev init -upgrade -reconfigure
          terraform -chdir=infra/terraform/sites/ffm-dev apply -auto-approve

      - name: Build Lambda zip
        run: |
          sudo apt-get install -y zip -q
          rm -rf sites/ffm/build
          mkdir -p sites/ffm/build
          # manylinux wheels: compatible with Lambda's Amazon Linux 2023
          pip install \
            --platform manylinux2014_x86_64 \
            --implementation cp \
            --python-version 3.12 \
            --only-binary=:all: \
            -t sites/ffm/build/ \
            -r sites/ffm/requirements.txt
          cp -r sites/ffm/app sites/ffm/build/
          cp sites/ffm/lambda/handler.py sites/ffm/build/
          (cd sites/ffm/build && zip -qr ../ffm-lambda.zip .)
          ls -lh sites/ffm/ffm-lambda.zip

      - name: Update Lambda function code
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="ffm-dev-site-${ACCOUNT_ID}"
          aws s3 cp sites/ffm/ffm-lambda.zip "s3://$BUCKET/deployments/ffm-lambda.zip" --region eu-central-1
          aws lambda wait function-updated --function-name "$FUNCTION" --region eu-central-1
          aws lambda update-function-code \
            --function-name "$FUNCTION" \
            --s3-bucket "$BUCKET" \
            --s3-key deployments/ffm-lambda.zip \
            --region eu-central-1
          aws lambda wait function-updated --function-name "$FUNCTION" --region eu-central-1

      - name: Sync static assets to S3
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="ffm-dev-site-${ACCOUNT_ID}"
          # The exclude lists below mirror deploy-ffm in deploy.yml, so dev serves exactly what prod would.
          # sites/ffm/tests/test_dev_deploy_workflow.py fails if the two drift apart. Keep them in sync.
          # robots.txt is excluded from the sync (which would delete it) and written separately below.
          aws s3 sync sites/ffm/static/ "s3://$BUCKET/" \
            --delete \
            --cache-control "no-cache, must-revalidate" \
            --exclude "index.html" \
            --exclude "robots.txt" \
            --exclude "*.test.js" \
            --exclude "game/calibrate.html" \
            --exclude "game/_dragon_test.html" \
            --exclude "export-sprites.html" \
            --exclude "game/hero-spritesheet.png" \
            --exclude "game/hero-spritesheet-upload.png" \
            --exclude "story/sources/*" \
            --exclude "story/references/*" \
            --exclude "story/tools/*" \
            --exclude "story/tests/*" \
            --exclude "story/preview.html" \
            --exclude "story/reel.html" \
            --exclude "story/README.md" \
            --exclude "story/ART-BIBLE.md" \
            --exclude "promo/tools/*" \
            --exclude "promo/README.md" \
            --exclude "beta/README.md"
          aws s3 cp sites/ffm/static/index.html \
            "s3://$BUCKET/index.html" \
            --cache-control "no-cache, no-store, must-revalidate"
          # Dev is for the developer: ask well-behaved crawlers not to index it.
          printf 'User-agent: *\nDisallow: /\n' | aws s3 cp - "s3://$BUCKET/robots.txt" \
            --content-type "text/plain" \
            --cache-control "no-cache, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?contains(Aliases.Items,'ffm-dev.derschweigert.de')].Id | [0]" \
            --output text)
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
          aws cloudfront wait distribution-deployed --id "$DIST_ID"

      - name: Smoke test
        run: |
          set -euo pipefail
          sleep 10
          for path in / /beta /play /index.html /game/main.js /robots.txt; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' "$BASE$path")"
            echo "$path -> $code"
            [[ "$code" == "200" ]] || { echo "::error::$path returned $code"; exit 1; }
          done
          # "/" is the promo page, not the game (CloudFront viewer-request function).
          # Download first, then grep: `curl | grep -q` fails under pipefail, because grep exits at the first
          # match while curl is still writing (deploy-ffm does the same for this reason).
          curl -sf "$BASE/" -o "$RUNNER_TEMP/ffm-dev-root.html"
          grep -q 'promo-root' "$RUNNER_TEMP/ffm-dev-root.html"
          curl -sf "$BASE/api/health" | grep '"ok":true'
          echo "Dev is up: $BASE"
