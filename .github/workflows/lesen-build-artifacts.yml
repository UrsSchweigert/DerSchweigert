name: Lesen build artifacts

on:
  workflow_dispatch:
  # A release tag, not every merge: the artifacts are what a release ships, and the tag is the moment they are needed.
  # Pattern copied from android-release.yml, so "tag a release" works the same way for both apps.
  push:
    tags: ['lesen-v*']

# Not on pull requests or on every push to main, on purpose: the iOS job needs a macOS runner, which bills at ten times
# the Linux rate, and every change to the app is already compiled by the native build in lesen-native.yml before it
# reaches main. A release tag or a manual run is the moment an artifact is actually needed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sites/lesen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sites/lesen/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - run: npm run build:debug
      - uses: actions/upload-artifact@v4
        with:
          name: lesen-debug-apk
          path: sites/lesen/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios-xcode-project:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sites/lesen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sites/lesen/package-lock.json
      - run: npm ci
      - run: npm run copy-assets
      - run: npx cap sync ios
      - name: Verify the project compiles unsigned
        run: |
          set -euo pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/lesen-derived" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Stage self-contained iOS project
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/lesen-ios"
          rm -rf "$stage"
          mkdir -p "$stage/sites/lesen"
          cp -R ios "$stage/sites/lesen/ios"
          mkdir -p "$stage/sites/lesen/node_modules"
          cp -R node_modules/@capacitor "$stage/sites/lesen/node_modules/@capacitor"
          tar -czf "$GITHUB_WORKSPACE/lesen-ios-project.tar.gz" -C "$stage" sites
      - uses: actions/upload-artifact@v4
        with:
          name: lesen-ios-xcode-project
          path: lesen-ios-project.tar.gz
          if-no-files-found: error
