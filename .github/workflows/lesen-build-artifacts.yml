name: Lesen build artifacts

on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths: ['sites/lesen/**']
  pull_request:
    paths: ['sites/lesen/**']

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sites/lesen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - run: npm run build:debug
      - uses: actions/upload-artifact@v4
        with:
          name: lesen-debug-apk
          path: sites/lesen/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios-xcode-project:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sites/lesen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run copy-assets
      - run: npx cap sync ios
      - name: Verify the project compiles unsigned
        run: |
          set -euo pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/lesen-derived" \
            CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: lesen-ios-xcode-project
          path: sites/lesen/ios
          if-no-files-found: error
