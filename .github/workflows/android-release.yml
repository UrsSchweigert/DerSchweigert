name: Android release (Buchstabenzeit)

# Explicit, manual-only Android release build. This is intentionally SEPARATE
# from deploy.yml (the website) and NEVER runs on a website deploy or push.
# It produces a signed .aab artifact for manual upload to Google Play.
# It does NOT upload to Google Play (v1 keeps publication manual, owner-approved).
on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'versionName (e.g. 1.1)'
        required: true
      versionCode:
        description: 'versionCode (integer, must strictly increase)'
        required: true
  push:
    tags:
      - 'android-v*'

permissions:
  contents: read

defaults:
  run:
    working-directory: sites/lesen

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Restore dependencies
        run: npm run restore

      - name: Run shared tests
        run: npm test

      - name: Resolve version (tag or inputs)
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            NAME="${GITHUB_REF_NAME#android-v}"
            CODE="${{ github.run_number }}"
          else
            NAME="${{ github.event.inputs.versionName }}"
            CODE="${{ github.event.inputs.versionCode }}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building versionName=$NAME versionCode=$CODE"

      - name: Decode upload keystore
        env:
          BZ_KEYSTORE_BASE64: ${{ secrets.BZ_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$BZ_KEYSTORE_BASE64" ]; then
            echo "::error::Missing secret BZ_KEYSTORE_BASE64. Add the base64-encoded upload keystore and the BZ_KEYSTORE_PASSWORD / BZ_KEY_ALIAS / BZ_KEY_PASSWORD secrets. See RELEASING.md."
            exit 1
          fi
          echo "$BZ_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Build signed AAB
        env:
          BZ_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          BZ_KEYSTORE_PASSWORD: ${{ secrets.BZ_KEYSTORE_PASSWORD }}
          BZ_KEY_ALIAS: ${{ secrets.BZ_KEY_ALIAS }}
          BZ_KEY_PASSWORD: ${{ secrets.BZ_KEY_PASSWORD }}
          BZ_VERSION_NAME: ${{ steps.ver.outputs.name }}
          BZ_VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: npm run build:release

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: buchstabenzeit-${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}-aab
          path: sites/lesen/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
