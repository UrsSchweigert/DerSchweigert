name: Refresh Station Data

on:
  schedule:
    # First day of every month at 03:00 UTC
    - cron: "0 3 1 * *"
  workflow_dispatch: {}

jobs:
  refresh:
    name: Download DB station snapshot
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to push the updated JSON back to main

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install httpx

      - name: Download stations
        env:
          DB_STADA_CLIENT_ID: ${{ secrets.DB_STADA_CLIENT_ID }}
          DB_STADA_API_KEY: ${{ secrets.DB_STADA_API_KEY }}
        run: python sites/landhauscheck/scripts/refresh_stations.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sites/landhauscheck/app/data/db_stations.json
          if git diff --cached --quiet; then
            echo "No changes to station data."
          else
            git commit -m "chore: refresh DB station snapshot ($(date -u +%Y-%m-%d))"
            git push
          fi
