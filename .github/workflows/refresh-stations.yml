name: Refresh Station Data

on:
  schedule:
    # First day of every month at 03:00 UTC
    - cron: "0 3 1 * *"
  workflow_dispatch: {}

jobs:
  refresh:
    name: Download DB station snapshot
    runs-on: ubuntu-latest

    permissions:
      contents: write       # push the refresh branch
      pull-requests: write  # open the PR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install httpx

      - name: Download stations
        env:
          DB_STADA_CLIENT_ID: ${{ secrets.DB_STADA_CLIENT_ID }}
          DB_STADA_API_KEY: ${{ secrets.DB_STADA_API_KEY }}
        run: python sites/landhauscheck/scripts/refresh_stations.py

      - name: Open pull request if changed
        env:
          GH_TOKEN: ${{ secrets.STATIONS_PR_TOKEN || github.token }}
        run: |
          if git diff --quiet -- sites/landhauscheck/app/data/db_stations.json; then
            echo "No changes to station data."
            exit 0
          fi
          BRANCH="chore/refresh-stations-$(date -u +%Y-%m-%d)"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add sites/landhauscheck/app/data/db_stations.json
          git commit -m "chore: refresh DB station snapshot ($(date -u +%Y-%m-%d))"
          git push --force origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore: refresh DB station snapshot ($(date -u +%Y-%m-%d))" \
            --body "Automated monthly refresh of db_stations.json." \
            || echo "PR already exists."
          gh pr merge "$BRANCH" --auto --squash || echo "Auto-merge not enabled; merge manually."
